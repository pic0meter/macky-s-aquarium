<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My 3D Model Website</title>
  
  <!-- Import the Google Model Viewer component -->
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #1a1a1a;
    }
    model-viewer {
      width: 100%;
      height: 90vh;
    }
  </style>
</head>
<body>

  <!-- Embed your model -->
  <model-viewer 
    src="model.gltf" 
    alt="A 3D textured model" 
    auto-rotate 
    camera-controls 
    ar>
  </model-viewer>

</body>
</html>
