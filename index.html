<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aesthetic Polygenic Betta Aquarium</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #01060f; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        .hud-panel {
            position: absolute;
            top: 25px;
            left: 25px;
            z-index: 10;
            color: #e2e8f0;
            background: rgba(4, 14, 28, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 22px;
            border: 1px solid rgba(0, 180, 216, 0.25);
            border-radius: 14px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
            width: 310px;
        }
        .hud-title { font-weight: 600; font-size: 0.95rem; margin-bottom: 12px; letter-spacing: 1px; text-transform: uppercase; color: #ccff33; }
        .hud-stat { font-size: 0.85rem; color: #94a3b8; margin-bottom: 6px; }
        
        .breed-panel {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }
        .selector-slot {
            background: rgba(255, 255, 255, 0.03);
            padding: 10px 12px;
            margin-bottom: 8px;
            font-size: 0.8rem;
            color: #64748b;
            border: 1px dashed rgba(255, 255, 255, 0.12);
            border-radius: 8px;
            text-overflow: ellipsis;
            overflow: hidden;
            white-space: nowrap;
            transition: all 0.25s ease;
        }
        .selector-slot.active { color: #fff; border: 1px solid #ccff33; background: rgba(204, 255, 51, 0.06); }
        
        input[type="text"] {
            width: 100%;
            background: rgba(1, 8, 18, 0.7);
            border: 1px solid rgba(0, 180, 216, 0.3);
            color: #fff;
            padding: 9px 12px;
            margin-bottom: 12px;
            font-size: 0.85rem;
            border-radius: 6px;
        }
        input[type="text"]:focus { outline: none; border-color: #ccff33; }
        
        button {
            width: 100%;
            background: linear-gradient(135deg, #00b4d8, #0077b6);
            color: #fff;
            border: none;
            padding: 11px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.2s;
        }
        button:hover { background: linear-gradient(135deg, #ccff33, #9ef01a); color: #020b14; }
        button:disabled { background: #1e293b; color: #475569; cursor: not-allowed; border: none; }

        .interaction-tip {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.75rem;
            pointer-events: none;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-align: center;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="hud-panel">
        <div class="hud-title">🧬 Aquascaping & Breeding</div>
        <div class="hud-stat" id="pop-count">Bettas Active: 0</div>
        
        <div class="breed-panel">
            <div class="hud-title" style="font-size:0.8rem; color:#00b4d8;">Selective Pairing</div>
            <div class="selector-slot" id="slot-a">Select Parent A...</div>
            <div class="selector-slot" id="slot-b">Select Parent B...</div>
            <input type="text" id="breeder-input" placeholder="Breeder Name" value="Lab Assistant">
            <button id="breed-btn" disabled onclick="executeManualBreeding()">Cross Chromosomes</button>
        </div>
    </div>

    <div class="interaction-tip">
        Click a Betta to select for breeding.<br>Tap empty space to drop nutritional pellets.
    </div>

    <canvas id="aquarium-canvas"></canvas>

    <script>
        const canvas = document.getElementById('aquarium-canvas');
        const ctx = canvas.getContext('2d');
        const popCountEl = document.getElementById('pop-count');
        const slotAEl = document.getElementById('slot-a');
        const slotBEl = document.getElementById('slot-b');
        const breedBtn = document.getElementById('breed-btn');
        const breederInput = document.getElementById('breeder-input');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        const school = [];
        const foods = [];
        const particles = [];
        let selectedA = null;
        let selectedB = null;

        // Populate beautiful ambient water particles
        for(let i=0; i<70; i++) {
            particles.push({
                x: Math.random() * width,
                y: Math.random() * height,
                r: Math.random() * 2 + 0.6,
                speed: Math.random() * 0.25 + 0.05,
                phase: Math.random() * Math.PI * 2
            });
        }

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        window.addEventListener('click', (e) => {
            if (e.clientX < 350 && e.clientY < 400) return;

            let clickedFish = null;
            for (let betta of school) {
                const dist = Math.sqrt((e.clientX - betta.x) ** 2 + (e.clientY - betta.y) ** 2);
                if (dist < 60) { clickedFish = betta; break; }
            }

            if (clickedFish) {
                handleFishSelection(clickedFish);
            } else {
                foods.push({ x: e.clientX, y: e.clientY, radius: 3.5, vy: 0.95 });
            }
        });

        function handleFishSelection(fish) {
            if (selectedA === fish) {
                selectedA = null;
            } else if (selectedB === fish) {
                selectedB = null;
            } else if (!selectedA) {
                selectedA = fish;
            } else {
                selectedB = fish;
            }
            updateSelectionHUD();
        }

        function updateSelectionHUD() {
            if (selectedA) {
                slotAEl.innerText = `A: ID-${selectedA.id} [Color: ${Math.floor(selectedA.phenotype.hBase)}° / Fins: ${getFinLabel(selectedA.phenotype.fSize)}]`;
                slotAEl.classList.add('active');
            } else {
                slotAEl.innerText = "Select Parent A...";
                slotAEl.classList.remove('active');
            }

            if (selectedB) {
                slotBEl.innerText = `B: ID-${selectedB.id} [Color: ${Math.floor(selectedB.phenotype.hBase)}° / Fins: ${getFinLabel(selectedB.phenotype.fSize)}]`;
                slotBEl.classList.add('active');
            } else {
                slotBEl.innerText = "Select Parent B...";
                slotBEl.classList.remove('active');
            }

            breedBtn.disabled = !(selectedA && selectedB);
        }

        function getFinLabel(size) {
            if (size < 0.95) return "Plakat";
            if (size < 1.45) return "Veiltail";
            return "Halfmoon";
        }

        function executeManualBreeding() {
            if (!selectedA || !selectedB) return;
            
            const breederName = breederInput.value.trim() || "Anonymous";
            const fry = new AquariumBetta(selectedA.genome, selectedB.genome, selectedA.x, selectedA.y, breederName);
            school.push(fry);
            
            selectedA = null;
            selectedB = null;
            updateSelectionHUD();
        }

        function hslStr(h, s, l, a = 1) {
            return `hsla(${Math.floor(h) % 360}, ${s}%, ${l}%, ${a})`;
        }

        let idCounter = 1;

        class AquariumBetta {
            constructor(parentA = null, parentB = null, spawnX = null, spawnY = null, breederName = "Wild Stock") {
                this.id = idCounter++;
                this.breeder = breederName;
                this.x = spawnX || Math.random() * width;
                this.y = spawnY || (0.2 + Math.random() * 0.6) * height;
                
                this.vx = (Math.random() - 0.5) * 1.4;
                this.vy = (Math.random() - 0.5) * 0.4;
                this.maxForce = 0.015;
                this.facingRight = this.vx > 0;

                // --- ADVANCED GENOME WITH MATING SYSTEM VARIATIONS ---
                if (parentA && parentB) {
                    this.genome = {
                        hueBase:    this.cross(parentA.hueBase, parentB.hueBase, 360, true),
                        hueAccent:  this.cross(parentA.hueAccent, parentB.hueAccent, 360, true),
                        metallic:   this.cross(parentA.metallic, parentB.metallic, 1.0, false),
                        finSize:    this.cross(parentA.finSize, parentB.finSize, 2.5, false),
                        tailSpread: this.cross(parentA.tailSpread, parentB.tailSpread, 2.5, false)
                    };
                } else {
                    // Random Base Genetic Configurations
                    this.genome = {
                        hueBase:    [Math.random() * 360, Math.random() * 360],
                        hueAccent:  [(Math.random() * 360), Math.random() * 360],
                        metallic:   [Math.random(), Math.random()],
                        finSize:    [0.6 + Math.random() * 1.8, 0.6 + Math.random() * 1.8],
                        tailSpread: [0.8 + Math.random() * 1.6, 0.8 + Math.random() * 1.6]
                    };
                }

                this.expressPhenotypes();

                // Advanced high-fidelity physics tracking spine nodes
                this.bodySegments = 12;
                this.history = [];
                for(let i = 0; i < 50; i++) {
                    this.history.push({ x: this.x, y: this.y, angle: 0 });
                }
                this.swimCycle = Math.random() * 100;
            }

            cross(pairA, pairB, range, circular) {
                const a = pairA[Math.floor(Math.random() * 2)];
                const b = pairB[Math.floor(Math.random() * 2)];
                let out = [a, b];
                if (Math.random() < 0.12) { // Mutation rate
                    const idx = Math.floor(Math.random() * 2);
                    out[idx] = circular ? (out[idx] + (Math.random() * 90 - 45) + 360) % range : Math.min(range, Math.max(0.4, out[idx] + (Math.random() * 0.5 - 0.25)));
                }
                return out;
            }

            expressPhenotypes() {
                const resolve = (p) => (p[0] + p[1]) * 0.5;
                this.phenotype = {
                    hBase: resolve(this.genome.hueBase),
                    hAcc:  resolve(this.genome.hueAccent),
                    metal: resolve(this.genome.metallic),
                    fSize: resolve(this.genome.finSize),
                    spread: resolve(this.genome.tailSpread)
                };

                // Pigment Layer Setup
                this.colorCore = hslStr(this.phenotype.hBase, 85, 42, 1);
                this.colorFinInner = hslStr(this.phenotype.hBase, 95, 45, 0.65);
                this.colorFinOuter = hslStr(this.phenotype.hAcc, 95, 55, 0.5);
                this.colorFinEdge = hslStr(this.phenotype.hAcc, 100, 75, 0.2);
                this.colorGlint = hslStr(this.phenotype.hAcc, 90, 70, this.phenotype.metal * 0.7);
                
                this.maxSpeed = 1.7 - (this.phenotype.fSize * 0.25);
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (Math.abs(this.vx) > 0.05) this.facingRight = this.vx > 0;

                if (this.x < 60) { this.x = 60; this.vx *= -1; }
                if (this.x > width - 60) { this.x = width - 60; this.vx *= -1; }
                if (this.y < 80) { this.y = 80; this.vy *= -1; }
                if (this.y > height - 80) { this.y = height - 80; this.vy *= -1; }

                const speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
                this.swimCycle += speed * 0.07 + 0.015;

                let angle = Math.atan2(this.vy, this.vx);
                this.history.unshift({ x: this.x, y: this.y, angle: angle });
                if (this.history.length > 55) this.history.pop();
            }

            flock(school) {
                let sepX = 0, sepY = 0, neighbors = 0;
                for (let other of school) {
                    if (other === this) continue;
                    const dX = other.x - this.x;
                    const dY = other.y - this.y;
                    const dist = Math.sqrt(dX*dX + dY*dY);
                    if (dist < 90) {
                        sepX -= dX / (dist + 0.001);
                        sepY -= dY / (dist + 0.001);
                        neighbors++;
                    }
                }

                if (neighbors > 0) {
                    let sF = this.steer(sepX * 1.5, sepY * 1.0);
                    this.vx += sF.x; this.vy += sF.y;
                }

                if (foods.length > 0) {
                    let closest = null; let closestDist = Infinity;
                    for (let food of foods) {
                        const d = Math.sqrt((food.x-this.x)**2 + (food.y-this.y)**2);
                        if (d < closestDist) { closestDist = d; closest = food; }
                    }
                    if (closest && closestDist < 600) {
                        let fSeek = this.steer(closest.x - this.x, closest.y - this.y);
                        this.vx += fSeek.x * 1.3; this.vy += fSeek.y * 1.3;
                        if (closestDist < 18) {
                            const idx = foods.indexOf(closest);
                            if (idx > -1) foods.splice(idx, 1);
                        }
                    }
                }

                if (Math.random() < 0.02) {
                    this.vx += (Math.random() - 0.5) * 0.35;
                    this.vy += (Math.random() - 0.5) * 0.12;
                }

                const s = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
                if (s > this.maxSpeed) { this.vx = (this.vx/s)*this.maxSpeed; this.vy = (this.vy/s)*this.maxSpeed; }
            }

            steer(tX, tY) {
                let dX = tX - this.vx; let dY = tY - this.vy;
                const d = Math.sqrt(dX * dX + dY * dY);
                if (d > this.maxForce) { dX = (dX / d) * this.maxForce; dY = (dY / d) * this.maxForce; }
                return { x: dX, y: dY };
            }

            // MESH FIN RENDERING: Connects neighboring rays to build continuous flowing sheets
            drawMeshFin(historyStartIndex, rayCount, lengthScale, widthRange, isDorsal) {
                const size = this.phenotype.fSize;
                const spread = this.phenotype.spread;
                
                let previousRayPoints = null;

                for (let r = 0; r <= rayCount; r++) {
                    const rayRatio = r / rayCount;
                    const historyIndex = Math.floor(historyStartIndex + rayRatio * 15);
                    const node = this.history[Math.min(historyIndex, this.history.length - 1)];
                    
                    const wave = Math.sin(this.swimCycle - (historyIndex * 0.22)) * (9 * size);
                    const angleOffset = (rayRatio - 0.5) * widthRange * spread;
                    
                    const targetAngle = node.angle + Math.PI + (isDorsal ? -0.45 : 0.45) + angleOffset;
                    // Creates an organic, rounded silhouette contour instead of spiked lines
                    const finLen = 48 * size * lengthScale * (0.85 + Math.sin(rayRatio * Math.PI) * 0.35);

                    const midX = node.x + Math.cos(targetAngle) * (finLen * 0.5);
                    const midY = node.y + Math.sin(targetAngle) * (finLen * 0.5) + wave * 0.6;
                    const endX = node.x + Math.cos(targetAngle) * finLen;
                    const endY = node.y + Math.sin(targetAngle) * finLen + wave;

                    const currentRayPoints = { base: node, mid: {x: midX, y: midY}, end: {x: endX, y: endY} };

                    if (previousRayPoints) {
                        ctx.beginPath();
                        ctx.moveTo(previousRayPoints.base.x, previousRayPoints.base.y);
                        ctx.quadraticCurveTo(previousRayPoints.mid.x, previousRayPoints.mid.y, previousRayPoints.end.x, previousRayPoints.end.y);
                        ctx.lineTo(currentRayPoints.end.x, currentRayPoints.end.y);
                        ctx.quadraticCurveTo(currentRayPoints.mid.x, currentRayPoints.mid.y, currentRayPoints.base.x, currentRayPoints.base.y);
                        ctx.closePath();

                        // Multi-stage color gradient matching true halfmoon overlapping sheets
                        const grad = ctx.createLinearGradient(node.x, node.y, endX, endY);
                        grad.addColorStop(0, this.colorFinInner);
                        grad.addColorStop(0.5, this.colorFinOuter);
                        grad.addColorStop(0.9, this.colorFinEdge);
                        grad.addColorStop(1.0, 'rgba(255,255,255,0)');

                        ctx.fillStyle = grad;
                        ctx.fill();
                    }
                    previousRayPoints = currentRayPoints;
                }
            }

            draw() {
                ctx.save();
                
                const size = this.phenotype.fSize;
                const spread = this.phenotype.spread;
                const dir = this.facingRight ? 1 : -1;

                // Selection Highlights
                if (selectedA === this || selectedB === this) {
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = '#ccff33';
                    ctx.strokeStyle = '#ccff33';
                    ctx.lineWidth = 2.5;
                    ctx.beginPath(); ctx.arc(this.x, this.y, 40, 0, Math.PI*2); ctx.stroke();
                    ctx.shadowBlur = 0;
                    ctx.font = 'bold 9px sans-serif';
                    ctx.fillStyle = '#ccff33';
                    ctx.fillText(selectedA === this ? 'PARENT A' : 'PARENT B', this.x - 24, this.y - 50);
                }

                ctx.globalCompositeOperation = "screen";

                // 1. TOP DORSAL VEIL MESH
                this.drawMeshFin(4, 14, 1.25, 0.95, true);

                // 2. BOTTOM VENTRAL VEIL MESH
                this.drawMeshFin(2, 16, 1.15, 0.85, false);

                // 3. CAUDAL HALFMOON MESH (Gorgeous, continuous fabric sheet)
                let previousCaudalPoints = null;
                const caudalRays = 26;

                for (let r = 0; r <= caudalRays; r++) {
                    const rayRatio = r / caudalRays;
                    const historyIndex = Math.floor(12 + rayRatio * 10);
                    const node = this.history[Math.min(historyIndex, this.history.length - 1)];
                    
                    const wave = Math.sin(this.swimCycle - (historyIndex * 0.25)) * (14 * size);
                    const spreadAngle = (rayRatio - 0.5) * (1.95 * spread); 
                    const tAngle = node.angle + Math.PI + spreadAngle;
                    const cLen = 70 * size * (0.9 + Math.sin(rayRatio * Math.PI) * 0.22);

                    const midX = node.x + Math.cos(tAngle) * (cLen * 0.5);
                    const midY = node.y + Math.sin(tAngle) * (cLen * 0.5) + wave * 0.5;
                    const endX = node.x + Math.cos(tAngle) * cLen;
                    const endY = node.y + Math.sin(tAngle) * cLen + wave;

                    const currentPoints = { base: node, mid: {x: midX, y: midY}, end: {x: endX, y: endY} };

                    if (previousCaudalPoints) {
                        ctx.beginPath();
                        ctx.moveTo(previousCaudalPoints.base.x, previousCaudalPoints.base.y);
                        ctx.quadraticCurveTo(previousCaudalPoints.mid.x, previousCaudalPoints.mid.y, previousCaudalPoints.end.x, previousCaudalPoints.end.y);
                        ctx.lineTo(currentPoints.end.x, currentPoints.end.y);
                        ctx.quadraticCurveTo(currentPoints.mid.x, currentPoints.mid.y, currentPoints.base.x, currentPoints.base.y);
                        ctx.closePath();

                        const grad = ctx.createLinearGradient(node.x, node.y, endX, endY);
                        grad.addColorStop(0, this.colorFinInner);
                        grad.addColorStop(0.5, this.colorFinOuter);
                        grad.addColorStop(0.88, this.colorFinEdge);
                        grad.addColorStop(1.0, 'rgba(255,255,255,0)');

                        ctx.fillStyle = grad;
                        ctx.fill();
                    }
                    previousCaudalPoints = currentPoints;
                }

                // 4. ANATOMICAL BODY SPINDLE TAPER
                ctx.globalCompositeOperation = "source-over";
                ctx.shadowBlur = 6;
                ctx.shadowColor = this.colorCore;
                
                for (let i = 0; i < this.bodySegments; i++) {
                    const node = this.history[Math.min(i * 2, this.history.length - 1)];
                    const t = (1 - (i / this.bodySegments));
                    const thickness = (8.5 * t) + 1.2;

                    if (this.phenotype.metal > 0.35 && i < 6) {
                        ctx.fillStyle = this.colorGlint;
                    } else {
                        ctx.fillStyle = this.colorCore;
                    }

                    ctx.beginPath();
                    ctx.arc(node.x, node.y, thickness, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.shadowBlur = 0;

                // 5. PECTORAL SILK FLAPS & OCULAR ELEMENTS
                const headNode = this.history[0];
                ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.beginPath();
                ctx.ellipse(headNode.x, headNode.y + 3, 5, 9, (dir * 0.4), 0, Math.PI * 2);
                ctx.fill();

                // Clear eye profile elements
                ctx.fillStyle = '#ffffff';
                ctx.beginPath(); ctx.arc(headNode.x + (6 * dir), headNode.y - 1, 2.2, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#010814';
                ctx.beginPath(); ctx.arc(headNode.x + (6.8 * dir), headNode.y - 1, 1.2, 0, Math.PI * 2); ctx.fill();

                // UI Identifier Tags
                ctx.font = '500 9px monospace';
                ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                ctx.fillText(`ID:${this.id} (${Math.floor(this.phenotype.hBase)}°)`, headNode.x - 25, headNode.y + 24);

                ctx.restore();
            }
        }

        // Initialize primary population loop
        for(let i = 0; i < 7; i++) { school.push(new AquariumBetta()); }

        function engineLoop() {
            // Smooth deep watercolor wash
            const bgGrad = ctx.createLinearGradient(0, 0, 0, height);
            bgGrad.addColorStop(0, '#041324');
            bgGrad.addColorStop(0.6, '#020b14');
            bgGrad.addColorStop(1, '#000408');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, width, height);

            popCountEl.innerText = `Bettas Active: ${school.length}`;

            // Render environmental particles
            ctx.fillStyle = 'rgba(0, 180, 216, 0.18)';
            particles.forEach(p => {
                p.phase += 0.008;
                p.y -= p.speed;
                p.x += Math.sin(p.phase) * 0.25;

                if(p.y < -10) { p.y = height + 10; p.x = Math.random() * width; }
                ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
            });

            // Process nutrients positions
            for (let i = foods.length - 1; i >= 0; i--) {
                let f = foods[i];
                f.y += f.vy;
                if (f.y > height - 30) { foods.splice(i, 1); continue; }
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#ccff33';
                ctx.fillStyle = '#ccff33';
                ctx.beginPath(); ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2); ctx.fill();
                ctx.shadowBlur = 0;
            }

            // Entities update execution
            school.forEach(betta => {
                betta.flock(school);
                betta.update();
                betta.draw();
            });

            requestAnimationFrame(engineLoop);
        }

        engineLoop();
    </script>
</body>
</html>
