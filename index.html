<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Continuous Polygenic Betta Canvas</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #01050d; font-family: monospace; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        .genetics-hud {
            position: absolute;
            top: 25px;
            left: 25px;
            z-index: 10;
            color: #70e000;
            background: rgba(1, 6, 15, 0.92);
            padding: 18px;
            border: 1px solid #38b000;
            border-radius: 6px;
            pointer-events: none;
            box-shadow: 0 0 25px rgba(56, 176, 0, 0.15);
        }
        .hud-title { font-weight: bold; font-size: 0.95rem; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1.5px; color: #ccff33;}
        .hud-stat { font-size: 0.85rem; color: #fff; opacity: 0.85; margin-top: 4px; }
        
        .interaction-tip {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.75rem;
            pointer-events: none;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div class="genetics-hud">
        <div class="hud-title">🧬 Continuous Polygenic Lab</div>
        <div class="hud-stat" id="pop-count">Population: 0</div>
        <div class="hud-stat" id="mutation-count">Accumulated Mutations: 0</div>
    </div>

    <div class="interaction-tip">Click to release nutrients. Unique lineages emerge upon interaction.</div>

    <canvas id="aquarium-canvas"></canvas>

    <script>
        const canvas = document.getElementById('aquarium-canvas');
        const ctx = canvas.getContext('2d');
        const popCountEl = document.getElementById('pop-count');
        const mutCountEl = document.getElementById('mutation-count');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        const school = [];
        const foods = [];
        const ripples = [];
        
        let totalMutations = 0;
        let audioCtx = null;
        const MUTATION_RATE = 0.04; // 4% point mutation probability per locus allele cross

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        function playSynthesisTone(freq, duration, type = 'sine') {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                if(type === 'triangle') osc.frequency.exponentialRampToValueAtTime(freq * 1.3, audioCtx.currentTime + duration);
                gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.start(); osc.stop(audioCtx.currentTime + duration);
            } catch(e){}
        }

        window.addEventListener('click', (e) => {
            foods.push({ x: e.clientX, y: e.clientY, radius: 3.5 });
            ripples.push({ x: e.clientX, y: e.clientY, radius: 2, maxRadius: 55, alpha: 0.25, color: '154, 235, 23' });
            playSynthesisTone(200, 0.1, 'sine');
        });

        // Helper function to convert dynamic HSL data strings to CSS format
        function hslStr(h, s, l, a = 1) {
            return `hsla(${h % 360}, ${Math.min(100, Math.max(0, s))}%, ${Math.min(100, Math.max(0, l))}%25, ${a})`;
        }

        class ContinuousBetta {
            constructor(parentA = null, parentB = null, spawnX = null, spawnY = null) {
                this.x = spawnX || Math.random() * width;
                this.y = spawnY || Math.random() * height;
                
                const angle = Math.random() * Math.PI * 2;
                this.vx = Math.cos(angle) * 0.9;
                this.vy = Math.sin(angle) * 0.9;
                this.maxForce = 0.02;
                this.perceptionRadius = 120;

                // --- POLYGENIC CONTINUOUS DYNAMICS CHROMOSOMES ---
                // Mapped as diploid float arrays containing quantitative expression variables
                if (parentA && parentB) {
                    this.genome = {
                        hueBase:    this.crossLocus(parentA.hueBase, parentB.hueBase, 360, true),
                        hueAccent:  this.crossLocus(parentA.hueAccent, parentB.hueAccent, 360, true),
                        metallic:   this.crossLocus(parentA.metallic, parentB.metallic, 1.0, false),
                        finSize:    this.crossLocus(parentA.finSize, parentB.finSize, 2.5, false),
                        tailSpread: this.crossLocus(parentA.tailSpread, parentB.tailSpread, 3.0, false),
                        crownRay:   this.crossLocus(parentA.crownRay, parentB.crownRay, 1.0, false)
                    };
                } else {
                    // Random generation for ancestral pristine foundation stock
                    this.genome = {
                        hueBase:    [Math.random() * 360, Math.random() * 360],
                        hueAccent:  [Math.random() * 360, Math.random() * 360],
                        metallic:   [Math.random(), Math.random()],
                        finSize:    [0.7 + Math.random() * 0.8, 0.7 + Math.random() * 0.8],
                        tailSpread: [1.2 + Math.random() * 1.5, 1.2 + Math.random() * 1.5],
                        crownRay:   [Math.random() > 0.75 ? Math.random() * 0.8 : 0, Math.random() > 0.75 ? Math.random() * 0.8 : 0]
                    };
                }

                this.expressPhenotypes();

                // Kinematic Tracking Arrays
                this.bodyLength = 11;
                this.history = [];
                for(let i = 0; i < 35; i++) {
                    this.history.push({ x: this.x, y: this.y, angle: angle });
                }

                this.swimCycle = Math.random() * 100;
                this.reproductionCooldown = parentA ? 600 : 150;
            }

            // Cross Locus transmission with stochastic point-shifting mutation drift
            crossLocus(pairA, pairB, maxRange, isCircular) {
                const alleleA = pairA[Math.floor(Math.random() * 2)];
                const alleleB = pairB[Math.floor(Math.random() * 2)];
                let outputPair = [alleleA, alleleB];

                // Check replication transcription error threshold
                if (Math.random() < MUTATION_RATE) {
                    totalMutations++;
                    const targetIdx = Math.floor(Math.random() * 2);
                    if (isCircular) {
                        outputPair[targetIdx] = (outputPair[targetIdx] + (Math.random() * 120 - 60) + 360) % maxRange;
                    } else {
                        outputPair[targetIdx] = Math.min(maxRange, Math.max(0.1, outputPair[targetIdx] + (Math.random() * 0.4 - 0.2)));
                    }
                    ripples.push({ x: this.x, y: this.y, radius: 4, maxRadius: 140, alpha: 0.8, color: '204, 255, 51' });
                    playSynthesisTone(680, 0.3, 'triangle');
                }
                return outputPair;
            }

            expressPhenotypes() {
                // Quantitative co-dominance summation (mean averaging allele values)
                const resolve = (pair) => (pair[0] + pair[1]) * 0.5;

                this.phenotype = {
                    hBase:   resolve(this.genome.hueBase),
                    hAcc:    resolve(this.genome.hueAccent),
                    metal:   resolve(this.genome.metallic),
                    fSize:   resolve(this.genome.finSize),
                    spread:  resolve(this.genome.tailSpread),
                    cRay:    resolve(this.genome.crownRay)
                };

                // Form color palette models
                this.colorCore = hslStr(this.phenotype.hBase, 85, 45, 1);
                this.colorFinInner = hslStr(this.phenotype.hBase, 90, 40, 0.3);
                this.colorFinOuter = hslStr(this.phenotype.hAcc, 95, 50, 0.22);
                this.colorGlint = hslStr(this.phenotype.hAcc, 100, 75, this.phenotype.metal * 0.8);

                this.maxSpeed = 1.5 - (this.phenotype.fSize * 0.2); // Fin drag calculation
            }

            update() {
                if(this.reproductionCooldown > 0) this.reproductionCooldown--;

                this.x += this.vx;
                this.y += this.vy;

                const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                if (speed > this.maxSpeed) {
                    this.vx = (this.vx / speed) * this.maxSpeed;
                    this.vy = (this.vy / speed) * this.maxSpeed;
                }

                const pad = 70;
                if (this.x < -pad) this.x = width + pad;
                if (this.x > width + pad) this.x = -pad;
                if (this.y < -pad) this.y = height + pad;
                if (this.y > height + pad) this.y = -pad;

                this.swimCycle += speed * 0.09;
                const headAngle = Math.atan2(this.vy, this.vx);
                
                this.history.unshift({ x: this.x, y: this.y, angle: headAngle });
                if (this.history.length > 40) this.history.pop();
            }

            flock(school) {
                let sepX = 0, sepY = 0, aliX = 0, aliY = 0, cohX = 0, cohY = 0, neighbors = 0;

                for (let other of school) {
                    if (other === this) continue;
                    const dX = other.x - this.x;
                    const dY = other.y - this.y;
                    const dist = Math.sqrt(dX * dX + dY * dY);

                    if (dist < this.perceptionRadius) {
                        sepX -= dX / (dist + 0.001);
                        sepY -= dY / (dist + 0.001);
                        aliX += other.vx; aliY += other.vy;
                        cohX += other.x; cohY += other.y;
                        neighbors++;
                    }

                    // Breeding engagement overlap triggers meiosis loop calculations
                    if (dist < 22 && this.reproductionCooldown === 0 && other.reproductionCooldown === 0 && school.length < 50) {
                        this.reproductionCooldown = 550;
                        other.reproductionCooldown = 550;
                        const fry = new ContinuousBetta(this.genome, other.genome, this.x, this.y);
                        school.push(fry);
                        ripples.push({ x: this.x, y: this.y, radius: 5, maxRadius: 85, alpha: 0.5, color: '255, 255, 255' });
                        playSynthesisTone(349, 0.2, 'sine');
                    }
                }

                if (neighbors > 0) {
                    aliX /= neighbors; aliY /= neighbors; cohX /= neighbors; cohY /= neighbors;
                    let sF = this.steer(sepX * 2.2, sepY * 2.2);
                    let aF = this.steer(aliX, aliY);
                    let cF = this.steer(cohX - this.x, cohY - this.y);
                    this.vx += sF.x * 1.1 + aF.x * 0.5 + cF.x * 0.4;
                    this.vy += sF.y * 1.1 + aF.y * 0.5 + cF.y * 0.4;
                }

                if (foods.length > 0) {
                    let closestFood = null; let closestDist = Infinity;
                    for (let food of foods) {
                        const fDist = Math.sqrt((food.x-this.x)**2 + (food.y-this.y)**2);
                        if (fDist < closestDist) { closestDist = fDist; closestFood = food; }
                    }
                    if (closestFood && closestDist < 280) {
                        let fSeek = this.steer(closestFood.x - this.x, closestFood.y - this.y);
                        this.vx += fSeek.x * 1.5; this.vy += fSeek.y * 1.5;
                        if (closestDist < 12) {
                            const idx = foods.indexOf(closestFood);
                            if (idx > -1) foods.splice(idx, 1);
                        }
                    }
                }
            }

            steer(tX, tY) {
                let dX = tX - this.vx; let dY = tY - this.vy;
                const d = Math.sqrt(dX * dX + dY * dY);
                if (d > this.maxForce) { dX = (dX / d) * this.maxForce; dY = (dY / d) * this.maxForce; }
                return { x: dX, y: dY };
            }

            draw() {
                ctx.save();
                
                const getSegment = (idx) => this.history[Math.min(idx, this.history.length - 1)];
                
                const head = getSegment(0);
                const thorax = getSegment(4);
                const abdomen = getSegment(10);
                const baseTail = getSegment(16);
                const tipTail = getSegment(26);

                const wave = Math.sin(this.swimCycle) * 0.18;
                const leftAngle = baseTail.angle + Math.PI / 2 + wave;
                const rightAngle = baseTail.angle - Math.PI / 2 + wave;
                
                const finScaleFactor = this.phenotype.fSize;
                const lengthMod = 35 * finScaleFactor;

                // Create watercolor blend gradient fields for fin elements
                const finGradient = ctx.createRadialGradient(abdomen.x, abdomen.y, 5, baseTail.x, baseTail.y, lengthMod * 1.5);
                finGradient.addColorStop(0, this.colorFinInner);
                finGradient.addColorStop(0.5, this.colorFinOuter);
                finGradient.addColorStop(1, 'rgba(0,0,0,0)');

                ctx.fillStyle = finGradient;

                // 1. EXTENDED VENTRAL & PECTORAL LAYER BLENDS
                ctx.beginPath();
                ctx.arc(thorax.x, thorax.y, 15 * finScaleFactor, thorax.angle - Math.PI/1.3, thorax.angle + Math.PI/1.3);
                ctx.fill();

                // 2. MAIN CAUDAL VEIL FLUID FAN PATH
                ctx.beginPath();
                ctx.moveTo(abdomen.x, abdomen.y);

                if (this.phenotype.cRay > 0.2) {
                    // Continuous Crown serration logic tracking interpolation positions
                    const rayCount = 12;
                    const rayIntensity = this.phenotype.cRay;
                    for (let j = 0; j <= rayCount; j++) {
                        const factor = j / rayCount;
                        const stepAngle = baseTail.angle + Math.PI + (factor - 0.5) * this.phenotype.spread;
                        const currentLength = lengthMod * (1.0 + Math.sin(factor * Math.PI) * 0.4) * (j % 2 === 0 ? 1.0 : 1.0 - rayIntensity * 0.3);
                        
                        ctx.lineTo(tipTail.x + Math.cos(stepAngle) * currentLength, 
                                   tipTail.y + Math.sin(stepAngle) * currentLength);
                    }
                    ctx.lineTo(abdomen.x, abdomen.y);
                } else {
                    // Smooth flowing continuous fan curvatures
                    ctx.bezierCurveTo(
                        baseTail.x + Math.cos(leftAngle) * (lengthMod * this.phenotype.spread),
                        baseTail.y + Math.sin(leftAngle) * (lengthMod * this.phenotype.spread),
                        tipTail.x + Math.cos(baseTail.angle + Math.PI) * (lengthMod * 2.2),
                        tipTail.y + Math.sin(baseTail.angle + Math.PI) * (lengthMod * 2.2),
                        abdomen.x + Math.cos(rightAngle) * (lengthMod * this.phenotype.spread),
                        abdomen.y + Math.sin(rightAngle) * (lengthMod * this.phenotype.spread)
                    );
                }
                ctx.closePath();
                ctx.fill();

                // 3. ANTERIOR DORSAL VEIL DRESS RIDGE
                ctx.beginPath();
                ctx.moveTo(thorax.x, thorax.y);
                ctx.quadraticCurveTo(abdomen.x + Math.cos(leftAngle) * (lengthMod * 0.8), abdomen.y + Math.sin(leftAngle) * (lengthMod * 0.8), baseTail.x, baseTail.y);
                ctx.lineTo(abdomen.x, abdomen.y);
                ctx.closePath();
                ctx.fill();

                // 4. METALLIC GUANINE HIGHLIGHT SHADER MASK
                if (this.phenotype.metal > 0.3) {
                    ctx.fillStyle = this.colorGlint;
                    ctx.beginPath();
                    ctx.arc(abdomen.x, abdomen.y, lengthMod * 0.6, baseTail.angle - Math.PI/2, baseTail.angle + Math.PI/2);
                    ctx.fill();
                }

                // 5. SOLID STRUCTURAL ANATOMY PATH
                ctx.fillStyle = this.colorCore;
                for (let i = 0; i < this.bodyLength; i++) {
                    const seg = getSegment(i * 2);
                    const thickness = (this.bodyLength - i) * 1.3;
                    ctx.beginPath();
                    ctx.arc(seg.x, seg.y, thickness, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Iridescent ocular points
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(head.x + Math.cos(head.angle + 0.65)*3.5, head.y + Math.sin(head.angle + 0.65)*3.5, 0.8, 0, Math.PI*2);
                ctx.arc(head.x + Math.cos(head.angle - 0.65)*3.5, head.y + Math.sin(head.angle - 0.65)*3.5, 0.8, 0, Math.PI*2);
                ctx.fill();

                ctx.restore();
            }
        }

        // Populate baseline lab stock
        for(let i=0; i<16; i++) { school.push(new ContinuousBetta()); }

        function engineLoop() {
            ctx.fillStyle = 'rgba(1, 4, 12, 0.22)'; // Transparent blending trails
            ctx.fillRect(0, 0, width, height);

            popCountEl.innerText = `Polygenic Bettas: ${school.length}`;
            mutCountEl.innerText = `Accumulated Mutations: ${totalMutations}`;

            // Render Interaction Ripples
            for (let i = ripples.length - 1; i >= 0; i--) {
                let r = ripples[i]; r.radius += 1.8; r.alpha -= 0.012;
                if (r.alpha <= 0) { ripples.splice(i, 1); continue; }
                ctx.strokeStyle = `rgba(${r.color}, ${r.alpha})`;
                ctx.lineWidth = 1.0; ctx.beginPath();
                ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2); ctx.stroke();
            }

            // Draw Pellets
            ctx.fillStyle = '#ccff33';
            for (let f of foods) { ctx.beginPath(); ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2); ctx.fill(); }

            // Update calculations for each entity
            school.forEach(betta => {
                betta.flock(school);
                betta.update();
                betta.draw();
            });

            requestAnimationFrame(engineLoop);
        }

        engineLoop();
    </script>
</body>
</html>
