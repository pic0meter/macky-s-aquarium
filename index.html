<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>24/7 Bird's-Eye Marine Ecosystem</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #011125;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            transition: background 2s ease-in-out;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .aquarium-hud {
            position: absolute;
            top: 30px;
            left: 30px;
            z-index: 10;
            color: rgba(255, 255, 255, 0.85);
            pointer-events: none;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .time-stream {
            font-size: 1.75rem;
            font-weight: 300;
            letter-spacing: 2px;
            font-variant-numeric: tabular-nums;
        }

        .eco-status {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 6px;
            opacity: 0.5;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .eco-status::before {
            content: "";
            display: inline-block;
            width: 6px;
            height: 6px;
            background: #00f5d4;
            border-radius: 50%;
            box-shadow: 0 0 8px #00f5d4;
        }

        .interaction-tip {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.8rem;
            letter-spacing: 1px;
            pointer-events: none;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="aquarium-hud">
        <div class="time-stream" id="clock-widget">00:00:00</div>
        <div class="eco-status" id="eco-label">Syncing Marine Cycle...</div>
    </div>

    <div class="interaction-tip">Click to drop food & generate ripples</div>

    <canvas id="aquarium-canvas"></canvas>

    <script>
        const canvas = document.getElementById('aquarium-canvas');
        const ctx = canvas.getContext('2d');
        const clockEl = document.getElementById('clock-widget');
        const statusEl = document.getElementById('eco-label');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        const foods = [];
        const ripples = [];
        let currentTheme = 'afternoon';
        let audioCtx = null;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        function playBubbleSound() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                osc.type = 'sine';
                osc.frequency.setValueAtTime(120, audioCtx.currentTime); 
                osc.frequency.exponentialRampToValueAtTime(320, audioCtx.currentTime + 0.15);

                gainNode.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } catch (e) { console.log(e); }
        }

        window.addEventListener('click', (e) => {
            foods.push({ x: e.clientX, y: e.clientY, radius: 4.5, active: true });
            ripples.push({ x: e.clientX, y: e.clientY, radius: 2, maxRadius: 70, alpha: 0.5, speed: 2 });
            playBubbleSound();
        });

        const THEMES = {
            morning: { bg: ['#0f4c5c', '#001d25'], fishColor: '#e36414', finColor: 'rgba(230, 92, 0, 0.4)', label: 'Morning Estuary' },
            afternoon: { bg: ['#006d77', '#003554'], fishColor: '#ffb703', finColor: 'rgba(255, 183, 3, 0.4)', label: 'Sunlit Reef Shallows' },
            evening: { bg: ['#3d348b', '#13001f'], fishColor: '#f72585', finColor: 'rgba(247, 37, 133, 0.4)', label: 'Twilight Current' },
            night: { bg: ['#050c1a', '#000209'], fishColor: '#7209b7', finColor: 'rgba(114, 9, 183, 0.3)', label: 'Bioluminescent Dynamic Deep' }
        };

        function updateEcosystemTime() {
            const now = new Date();
            const hours = now.getHours();
            clockEl.innerText = now.toTimeString().split(' ')[0];

            let activeKey = 'afternoon';
            if (hours >= 6 && hours < 12) activeKey = 'morning';
            else if (hours >= 12 && hours < 18) activeKey = 'afternoon';
            else if (hours >= 18 && hours < 22) activeKey = 'evening';
            else activeKey = 'night';

            currentTheme = activeKey;
            statusEl.innerText = `Ecosystem: ${THEMES[activeKey].label}`;
        }

        // --- SEGMENTED PHYSICS FISH CLASS (TOP-DOWN VIEW) ---
        class TopDownFish {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                
                const angle = Math.random() * Math.PI * 2;
                this.vx = Math.cos(angle) * 1.5;
                this.vy = Math.sin(angle) * 1.5;

                this.maxSpeed = 1.8;
                this.maxForce = 0.03;
                this.perceptionRadius = 90;

                // Physics Body Customizations
                this.bodyLength = 9; // Number of joint segments
                this.segmentSpacing = 5; // Distance between bones
                this.history = []; // Array to track prior locations for spine physics
                
                // Initialize physics backbone array
                for(let i = 0; i < this.bodyLength; i++) {
                    this.history.push({ x: this.x, y: this.y });
                }

                // Aesthetic scaling variations
                this.sizeScale = Math.random() * 0.4 + 0.8; 
                this.swimCycle = Math.random() * 100; // Offset animation loops
            }

            edges() {
                const pad = 50;
                if (this.x < -pad) this.x = width + pad;
                if (this.x > width + pad) this.x = -pad;
                if (this.y < -pad) this.y = height + pad;
                if (this.y > height + pad) this.y = -pad;
            }

            steer(tX, tY) {
                let dX = tX - this.vx;
                let dY = tY - this.vy;
                const dist = Math.sqrt(dX * dX + dY * dY);
                if (dist > this.maxForce) {
                    dX = (dX / dist) * this.maxForce;
                    dY = (dY / dist) * this.maxForce;
                }
                return { x: dX, y: dY };
            }

            flock(school) {
                let sepX = 0, sepY = 0, aliX = 0, aliY = 0, cohX = 0, cohY = 0;
                let neighbors = 0;

                for (let other of school) {
                    if (other === this) continue;
                    const dX = other.x - this.x;
                    const dY = other.y - this.y;
                    const dist = Math.sqrt(dX * dX + dY * dY);

                    if (dist < this.perceptionRadius) {
                        sepX -= dX / (dist + 0.001);
                        sepY -= dY / (dist + 0.001);
                        aliX += other.vx;
                        aliY += other.vy;
                        cohX += other.x;
                        cohY += other.y;
                        neighbors++;
                    }
                }

                if (neighbors > 0) {
                    aliX /= neighbors; aliY /= neighbors;
                    cohX /= neighbors; cohY /= neighbors;

                    const cohesionForce = this.steer(cohX - this.x, cohY - this.y);
                    const separationForce = this.steer(sepX * 2.5, sepY * 2.5);
                    const alignmentForce = this.steer(aliX, aliY);

                    this.vx += separationForce.x * 1.5 + alignmentForce.x * 0.8 + cohesionForce.x * 0.8;
                    this.vy += separationForce.y * 1.5 + alignmentForce.y * 0.8 + cohesionForce.y * 0.8;
                }

                // Food Target Intercept Logic
                if (foods.length > 0) {
                    let closestFood = null;
                    let closestDist = Infinity;

                    for (let food of foods) {
                        const fDX = food.x - this.x;
                        const fDY = food.y - this.y;
                        const fDist = Math.sqrt(fDX * fDX + fDY * fDY);
                        if (fDist < closestDist && fDist < 300) {
                            closestDist = fDist;
                            closestFood = food;
                        }
                    }

                    if (closestFood) {
                        const foodSeek = this.steer(closestFood.x - this.x, closestFood.y - this.y);
                        this.vx += foodSeek.x * 2.0;
                        this.vy += foodSeek.y * 2.0;

                        if (closestDist < 15) {
                            const index = foods.indexOf(closestFood);
                            if (index > -1) foods.splice(index, 1);
                        }
                    }
                }
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                if (speed > this.maxSpeed) {
                    this.vx = (this.vx / speed) * this.maxSpeed;
                    this.vy = (this.vy / speed) * this.maxSpeed;
                }
                this.edges();

                // --- SPINE SEGMENTATION KINETIC PHYSICS ---
                this.swimCycle += speed * 0.12;
                
                // Head point acts as leader index
                this.history[0].x = this.x;
                this.history[0].y = this.y;

                // Procedural kinematics loop pushing positions down the backbone joints
                for (let i = 1; i < this.bodyLength; i++) {
                    const prev = this.history[i - 1];
                    const curr = this.history[i];
                    
                    const dx = curr.x - prev.x;
                    const dy = curr.y - prev.y;
                    const distance = Math.sqrt(dx * dx + dx * dy);
                    const heading = Math.atan2(dy, dx);

                    // Add lateral undulation wave that decreases in size towards the nose
                    const wave = Math.sin(this.swimCycle - (i * 0.5)) * (i * 0.35) * (speed / this.maxSpeed);

                    curr.x = prev.x + Math.cos(heading) * this.segmentSpacing;
                    curr.y = prev.y + Math.sin(heading) * this.segmentSpacing + wave;
                }
            }

            draw() {
                const currentColors = THEMES[currentTheme];
                ctx.save();
                
                ctx.shadowBlur = currentTheme === 'night' ? 10 : 0;
                ctx.shadowColor = currentColors.fishColor;

                // Render dynamic translucent fins
                ctx.fillStyle = currentColors.finColor;
                const head = this.history[0];
                const mid = this.history[Math.floor(this.bodyLength / 3)];
                const tail = this.history[this.bodyLength - 1];
                const angle = Math.atan2(this.vy, this.vx);

                // Side pectoral fins
                ctx.beginPath();
                ctx.arc(mid.x, mid.y, 8 * this.sizeScale, angle - Math.PI/2, angle + Math.PI/2);
                ctx.fill();

                // Tail Fin structure
                ctx.beginPath();
                ctx.moveTo(tail.x, tail.y);
                ctx.lineTo(tail.x - Math.cos(angle + 0.5) * 14 * this.sizeScale, tail.y - Math.sin(angle + 0.5) * 14 * this.sizeScale);
                ctx.lineTo(tail.x - Math.cos(angle - 0.5) * 14 * this.sizeScale, tail.y - Math.sin(angle - 0.5) * 14 * this.sizeScale);
                ctx.closePath();
                ctx.fill();

                // Draw main tapered organic body profile using bone nodes
                ctx.fillStyle = currentColors.fishColor;
                for (let i = 0; i < this.bodyLength; i++) {
                    const segment = this.history[i];
                    // Dynamic thickness rendering (tapering down towards tail)
                    const radius = (this.bodyLength - i) * 1.1 * this.sizeScale;
                    
                    ctx.beginPath();
                    ctx.arc(segment.x, segment.y, radius, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            }
        }

        const school = Array.from({ length: 45 }, () => new TopDownFish());

        function mainLoop() {
            const activeBg = THEMES[currentTheme].bg;
            const gradient = ctx.createLinearGradient(0, 0, width, height);
            gradient.addColorStop(0, activeBg[0]);
            gradient.addColorStop(1, activeBg[1]);
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);

            // Update & Render Water Surface Ripple Lines
            for (let i = ripples.length - 1; i >= 0; i--) {
                let r = ripples[i];
                r.radius += r.speed;
                r.alpha -= r.speed / r.maxRadius;

                if (r.alpha <= 0) {
                    ripples.splice(i, 1);
                    continue;
                }

                ctx.strokeStyle = `rgba(255, 255, 255, ${r.alpha})`;
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
                ctx.stroke();
            }

            // Render Floating Food Flakes
            ctx.fillStyle = '#ffb703';
            ctx.shadowBlur = 6;
            ctx.shadowColor = '#ffb703';
            for (let i = foods.length - 1; i >= 0; i--) {
                let f = foods[i];
                ctx.beginPath();
                ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.shadowBlur = 0;

            // Compute Fish Updates & Spine Mechanics
            school.forEach(fish => {
                fish.flock(school);
                fish.update();
                fish.draw();
            });

            requestAnimationFrame(mainLoop);
        }

        setInterval(updateEcosystemTime, 1000);
        updateEcosystemTime();
        mainLoop();
    </script>
</body>
</html>
