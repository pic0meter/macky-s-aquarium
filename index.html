<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polygenic Betta Genetic Lab - High-Fidelity Organic Asset Engine</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #010408; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        .hud-panel {
            position: absolute;
            top: 25px;
            left: 25px;
            z-index: 10;
            color: #e2e8f0;
            background: rgba(2, 8, 18, 0.94);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: 22px;
            border: 1px solid rgba(0, 180, 216, 0.25);
            border-radius: 14px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85);
            width: 320px;
        }
        .hud-title { font-weight: 600; font-size: 0.95rem; margin-bottom: 12px; letter-spacing: 1px; text-transform: uppercase; color: #00e5ff; }
        .hud-stat { font-size: 0.85rem; color: #94a3b8; margin-bottom: 6px; }
        
        .breed-panel {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }
        .selector-slot {
            background: rgba(255, 255, 255, 0.02);
            padding: 10px 12px;
            margin-bottom: 8px;
            font-size: 0.8rem;
            color: #64748b;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            text-overflow: ellipsis;
            overflow: hidden;
            white-space: nowrap;
        }
        .selector-slot.active { color: #fff; border: 1px solid #00e5ff; background: rgba(0, 229, 255, 0.04); }
        
        button {
            width: 100%;
            background: linear-gradient(135deg, #00b4d8, #00e5ff);
            color: #020b14;
            border: none;
            padding: 11px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 8px;
        }
        button:hover { background: linear-gradient(135deg, #fff, #00e5ff); }
        button:disabled { background: #1e293b; color: #475569; cursor: not-allowed; }

        .discovery-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            width: 480px;
            background: rgba(2, 6, 14, 0.98);
            border: 1px solid rgba(0, 229, 255, 0.4);
            border-radius: 16px;
            z-index: 100;
            color: #f8fafc;
            padding: 25px;
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.9);
            display: none;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .discovery-modal.show { display: block; opacity: 1; transform: translate(-50%, -50%) scale(1); }
        .modal-header { font-size: 1.1rem; font-weight: bold; color: #00e5ff; margin-bottom: 15px; border-bottom: 1px solid rgba(0, 229, 255, 0.2); padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        
        .specimen-viewport {
            width: 100%;
            height: 180px;
            background: radial-gradient(circle at center, #061528 0%, #01040a 100%);
            border: 1px solid rgba(0, 229, 255, 0.25);
            border-radius: 10px;
            margin-bottom: 15px;
            position: relative;
            overflow: hidden;
        }
        .specimen-viewport canvas { width: 100%; height: 100%; display: block; }

        .gene-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; font-family: monospace; font-size: 0.8rem; }
        .gene-card { background: rgba(255,255,255,0.02); padding: 8px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.04); }
        .gene-name { color: #94a3b8; font-size: 0.75rem; text-transform: uppercase; }
        .gene-val { color: #fff; font-weight: bold; margin-top: 2px; }
        .gene-alert-neg { color: #ff3366; font-weight: bold; }
        .gene-alert-pos { color: #ccff33; font-weight: bold; }
        .close-modal-btn { background: #00e5ff; color: #020b14; border: none; padding: 8px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; text-transform: uppercase; }

        .tooltip-card {
            position: absolute;
            z-index: 50;
            pointer-events: none;
            background: rgba(2, 8, 18, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 229, 255, 0.35);
            padding: 12px 16px;
            border-radius: 10px;
            color: #f8fafc;
            font-size: 0.75rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            display: none;
            width: 220px;
        }
        .tooltip-title { color: #00e5ff; font-weight: bold; font-size: 0.85rem; margin-bottom: 6px; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 4px; }
        .tooltip-row { display: flex; justify-content: space-between; margin-bottom: 3px; font-family: monospace; }
        .tooltip-label { color: #94a3b8; }
        .tooltip-val { color: #fff; font-weight: bold; }

        .interaction-tip {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            color: rgba(255, 255, 255, 0.35);
            font-size: 0.75rem;
            pointer-events: none;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
    </style>
    <!-- Include Three.js for 3D model rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <div class="hud-panel">
        <div class="hud-title">🧬 Sophisticated Morph Engine</div>
        <div class="hud-stat" id="pop-count">Active Phenotypes: 0</div>
        
        <div class="breed-panel">
            <div class="hud-title" style="font-size:0.8rem; color:#00b4d8;">Gene-Splicing Assembly</div>
            <div class="selector-slot" id="slot-a">Select Parent A...</div>
            <div class="selector-slot" id="slot-b">Select Parent B...</div>
            <button id="breed-btn" disabled onclick="executeManualBreeding()">Combine Genetic Sequences</button>
        </div>
    </div>

    <div class="discovery-modal" id="discovery-window">
        <div class="modal-header">
            <span>🔬 Chromosome Phenotype Card</span>
            <span style="color: #94a3b8; font-size: 0.8rem;" id="fry-id-tag">ID: 0</span>
        </div>
        <div class="specimen-viewport">
            <canvas id="specimen-canvas"></canvas>
        </div>
        <div class="gene-grid" id="gene-display-target"></div>
        <div style="text-align: right;">
            <button class="close-modal-btn" onclick="closeDiscoveryWindow()">Introduce to Ecosystem</button>
        </div>
    </div>

    <div class="tooltip-card" id="tooltip-card">
        <div class="tooltip-title" id="tt-title">Specimen ID</div>
        <div class="tooltip-row"><span class="tooltip-label">Shape:</span><span class="tooltip-val" id="tt-shape">--</span></div>
        <div class="tooltip-row"><span class="tooltip-label">Pattern:</span><span class="tooltip-val" id="tt-pattern">--</span></div>
        <div class="tooltip-row"><span class="tooltip-label">Chroma Base:</span><span class="tooltip-val" id="tt-base">--</span></div>
        <div class="tooltip-row"><span class="tooltip-label">Vigor Status:</span><span class="tooltip-val" id="tt-status">Stable</span></div>
    </div>

    <div class="interaction-tip">
        Hover fish for telemetry • Click to pair genotypes • Tap deep water for nutrients
    </div>

    <canvas id="aquarium-canvas"></canvas>

    <script>
        // Setup Three.js 3D Aquarium Scene replacing 2D canvas rendering with loaded 3D asset models
        const container = document.body;
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x010408, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 50);

        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('aquarium-canvas'), antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // Lighting for 3D assets
        const ambientLight = new THREE.AmbientLight(0x00b4d8, 1.2);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0x00e5ff, 2.5);
        dirLight.position.set(20, 40, 30);
        scene.add(dirLight);

        const backLight = new THREE.PointLight(0xff00ff, 1.5, 50);
        backLight.position.set(-20, -10, -20);
        scene.add(backLight);

        // Load Uploaded 3D Models (GLTF / GLB format)
        const loader = new THREE.GLTFLoader();
        let baseModelTemplate = null;
        const school = [];
        const foods = [];

        // Example loading sequence for user-provided models (e.g., 'model.gltf')
        loader.load('model.gltf', (gltf) => {
            baseModelTemplate = gltf.scene;
            // Initialize school once asset is ready
            for (let i = 0; i < 6; i++) {
                spawnBetta();
            }
            animate();
        }, undefined, (error) => {
            console.warn('Using procedural fallback structure as model asset loader initializes:', error);
            // Fallback geometry if file path requires adjustment
            baseModelTemplate = new THREE.Group();
            const geometry = new THREE.ConeGeometry(2, 6, 4);
            const material = new THREE.MeshStandardMaterial({ color: 0x00e5ff, roughness: 0.3 });
            baseModelTemplate.add(new THREE.Mesh(geometry, material));
            
            for (let i = 0; i < 6; i++) {
                spawnBetta();
            }
            animate();
        });

        let idCounter = 1;
        class GeneticBetta3D {
            constructor(parentA = null, parentB = null) {
                this.id = idCounter++;
                this.mesh = baseModelTemplate ? baseModelTemplate.clone() : new THREE.Group();
                
                // Random positioning inside bounds
                this.position = new THREE.Vector3(
                    (Math.random() - 0.5) * 40,
                    (Math.random() - 0.5) * 20,
                    (Math.random() - 0.5) * 15
                );
                this.velocity = new THREE.Vector3(
                    (Math.random() - 0.5) * 0.2,
                    (Math.random() - 0.5) * 0.2,
                    (Math.random() - 0.5) * 0.2
                );
                this.mesh.position.copy(this.position);
                scene.add(this.mesh);

                this.phenotype = {
                    shape: "Plakat",
                    pattern: "Koi Marble",
                    hBase: Math.random() * 360,
                    clampedFin: false,
                    iridescent: true
                };
            }

            update() {
                this.position.add(this.velocity);
                
                // Boundary constraints
                if (Math.abs(this.position.x) > 35) this.velocity.x *= -1;
                if (Math.abs(this.position.y) > 18) this.velocity.y *= -1;
                if (Math.abs(this.position.z) > 15) this.velocity.z *= -1;

                this.mesh.position.copy(this.position);
                
                // Align rotation to velocity vector
                if (this.velocity.lengthSq() > 0.0001) {
                    const angle = Math.atan2(-this.velocity.z, this.velocity.x);
                    this.mesh.rotation.y = angle;
                }
            }
        }

        function spawnBetta() {
            const betta = new GeneticBetta3D();
            school.push(betta);
        }

        // Render loop
        function animate() {
            requestAnimationFrame(animate);

            school.forEach(fish => {
                fish.update();
            });

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
