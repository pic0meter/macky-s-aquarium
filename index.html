<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polygenic Betta Selective Breeding Lab</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #010c1a; font-family: monospace; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        .hud-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            color: #00f5d4;
            background: rgba(2, 16, 37, 0.95);
            padding: 15px;
            border: 1px solid #00b4d8;
            border-radius: 6px;
            box-shadow: 0 0 20px rgba(0, 245, 212, 0.15);
            width: 280px;
        }
        .hud-title { font-weight: bold; font-size: 0.95rem; margin-bottom: 8px; text-transform: uppercase; color: #ccff33; }
        .hud-stat { font-size: 0.8rem; color: #fff; opacity: 0.9; margin-bottom: 4px; }
        
        .breed-panel {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px dashed #00b4d8;
        }
        .selector-slot {
            background: rgba(255,255,255,0.05);
            padding: 6px;
            margin-bottom: 6px;
            font-size: 0.75rem;
            color: #aaa;
            border-radius: 4px;
            text-overflow: ellipsis;
            overflow: hidden;
            white-space: nowrap;
        }
        .selector-slot.active { color: #fff; border: 1px solid #ccff33; background: rgba(204,255,51,0.05); }
        
        input[type="text"] {
            width: 100%;
            background: #010c1a;
            border: 1px solid #00b4d8;
            color: #fff;
            padding: 5px;
            margin-bottom: 8px;
            font-family: monospace;
            font-size: 0.8rem;
            border-radius: 4px;
        }
        input[type="text"]:focus { outline: none; border-color: #ccff33; }
        
        button {
            width: 100%;
            background: #00b4d8;
            color: #010c1a;
            border: none;
            padding: 8px;
            font-weight: bold;
            font-family: monospace;
            cursor: pointer;
            border-radius: 4px;
            text-transform: uppercase;
        }
        button:hover { background: #ccff33; }
        button:disabled { background: #334e68; color: #627d98; cursor: not-allowed; }

        .interaction-tip {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.75rem;
            pointer-events: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="hud-panel">
        <div class="hud-title">🧬 Selective Breeding Lab</div>
        <div class="hud-stat" id="pop-count">Bettas: 0</div>
        
        <div class="breed-panel">
            <div class="hud-title" style="font-size:0.8rem; color:#00b4d8;">Mating Selection</div>
            <div class="selector-slot" id="slot-a">Parent A: Click a Betta...</div>
            <div class="selector-slot" id="slot-b">Parent B: Click a second Betta...</div>
            <input type="text" id="breeder-input" placeholder="Enter Breeder Name" value="Lab Assistant">
            <button id="breed-btn" disabled onclick="executeManualBreeding()">Perform Cross</button>
        </div>
    </div>

    <div class="interaction-tip">
        Click a Betta to select for breeding.<br>Click empty water to drop nutritional pellets.
    </div>

    <canvas id="aquarium-canvas"></canvas>

    <script>
        const canvas = document.getElementById('aquarium-canvas');
        const ctx = canvas.getContext('2d');
        const popCountEl = document.getElementById('pop-count');
        const slotAEl = document.getElementById('slot-a');
        const slotBEl = document.getElementById('slot-b');
        const breedBtn = document.getElementById('breed-btn');
        const breederInput = document.getElementById('breeder-input');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        const school = [];
        const foods = [];
        let selectedA = null;
        let selectedB = null;
        let audioCtx = null;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        function playTone(freq, duration, type = 'sine') {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.start(); osc.stop(audioCtx.currentTime + duration);
            } catch(e){}
        }

        window.addEventListener('click', (e) => {
            if (e.clientX < 310 && e.clientY < 300) return;

            let clickedFish = null;
            for (let betta of school) {
                const dist = Math.sqrt((e.clientX - betta.x) ** 2 + (e.clientY - betta.y) ** 2);
                if (dist < 40) { clickedFish = betta; break; }
            }

            if (clickedFish) {
                handleFishSelection(clickedFish);
            } else {
                foods.push({ x: e.clientX, y: e.clientY, radius: 4, vy: 1.2 });
                playTone(220, 0.08, 'sine');
            }
        });

        function handleFishSelection(fish) {
            if (selectedA === fish) {
                selectedA = null;
            } else if (selectedB === fish) {
                selectedB = null;
            } else if (!selectedA) {
                selectedA = fish;
            } else {
                selectedB = fish;
            }
            updateSelectionHUD();
        }

        function updateSelectionHUD() {
            if (selectedA) {
                slotAEl.innerText = `A: ID-${selectedA.id} (${selectedA.breeder})`;
                slotAEl.classList.add('active');
            } else {
                slotAEl.innerText = "Parent A: Click a Betta...";
                slotAEl.classList.remove('active');
            }

            if (selectedB) {
                slotBEl.innerText = `B: ID-${selectedB.id} (${selectedB.breeder})`;
                slotBEl.classList.add('active');
            } else {
                slotBEl.innerText = "Parent B: Click a second Betta...";
                slotBEl.classList.remove('active');
            }

            breedBtn.disabled = !(selectedA && selectedB);
        }

        function executeManualBreeding() {
            if (!selectedA || !selectedB) return;
            
            const breederName = breederInput.value.trim() || "Unknown Breeder";
            const fry = new AquariumBetta(selectedA.genome, selectedB.genome, selectedA.x, selectedA.y, breederName);
            school.push(fry);
            
            playTone(440, 0.3, 'triangle');
            
            selectedA = null;
            selectedB = null;
            updateSelectionHUD();
        }

        function hslStr(h, s, l, a = 1) {
            return `hsla(${h % 360}, ${Math.min(100, Math.max(0, s))}%25, ${Math.min(100, Math.max(0, l))}%25, ${a})`;
        }

        let idCounter = 1;

        class AquariumBetta {
            constructor(parentA = null, parentB = null, spawnX = null, spawnY = null, breederName = "Wild Lineage") {
                this.id = idCounter++;
                this.breeder = breederName;
                this.x = spawnX || Math.random() * width;
                this.y = spawnY || (0.2 + Math.random() * 0.6) * height;
                
                this.vx = (Math.random() - 0.5) * 1.5;
                this.vy = (Math.random() - 0.5) * 0.4;
                this.maxForce = 0.02;
                this.perceptionRadius = 130;
                this.facingRight = this.vx > 0;

                if (parentA && parentB) {
                    this.genome = {
                        hueBase:    this.cross(parentA.hueBase, parentB.hueBase, 360, true),
                        hueAccent:  this.cross(parentA.hueAccent, parentB.hueAccent, 360, true),
                        metallic:   this.cross(parentA.metallic, parentB.metallic, 1.0, false),
                        finSize:    this.cross(parentA.finSize, parentB.finSize, 2.2, false),
                        tailSpread: this.cross(parentA.tailSpread, parentB.tailSpread, 2.5, false)
                    };
                } else {
                    this.genome = {
                        hueBase:    [Math.random() * 360, Math.random() * 360],
                        hueAccent:  [Math.random() * 360, Math.random() * 360],
                        metallic:   [Math.random(), Math.random()],
                        finSize:    [0.8 + Math.random() * 0.8, 0.8 + Math.random() * 0.8],
                        tailSpread: [1.0 + Math.random() * 1.2, 1.0 + Math.random() * 1.2]
                    };
                }

                this.expressPhenotypes();

                this.bodyLength = 10;
                this.history = [];
                for(let i = 0; i < 30; i++) {
                    this.history.push({ x: this.x, y: this.y, vy: this.vy });
                }
                this.swimCycle = Math.random() * 100;
            }

            cross(pairA, pairB, range, circular) {
                const a = pairA[Math.floor(Math.random() * 2)];
                const b = pairB[Math.floor(Math.random() * 2)];
                let out = [a, b];
                if (Math.random() < 0.05) {
                    const idx = Math.floor(Math.random() * 2);
                    out[idx] = circular ? (out[idx] + (Math.random() * 100 - 50) + 360) % range : Math.min(range, Math.max(0.1, out[idx] + (Math.random() * 0.3 - 0.15)));
                }
                return out;
            }

            expressPhenotypes() {
                const resolve = (p) => (p[0] + p[1]) * 0.5;
                this.phenotype = {
                    hBase: resolve(this.genome.hueBase),
                    hAcc:  resolve(this.genome.hueAccent),
                    metal: resolve(this.genome.metallic),
                    fSize: resolve(this.genome.finSize),
                    spread: resolve(this.genome.tailSpread)
                };

                this.colorCore = hslStr(this.phenotype.hBase, 85, 45, 1);
                this.colorFinInner = hslStr(this.phenotype.hBase, 90, 40, 0.4);
                this.colorFinOuter = hslStr(this.phenotype.hAcc, 95, 52, 0.25);
                this.colorGlint = hslStr(this.phenotype.hAcc, 100, 75, this.phenotype.metal * 0.7);
                
                this.maxSpeed = 1.4 - (this.phenotype.fSize * 0.15);
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (Math.abs(this.vx) > 0.1) this.facingRight = this.vx > 0;

                if (this.x < 40) { this.x = 40; this.vx *= -1; }
                if (this.x > width - 40) { this.x = width - 40; this.vx *= -1; }
                if (this.y < 50) { this.y = 50; this.vy *= -1; }
                if (this.y > height - 50) { this.y = height - 50; this.vy *= -1; }

                const speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
                this.swimCycle += speed * 0.12 + 0.02;

                this.history.unshift({ x: this.x, y: this.y, vy: this.vy });
                if (this.history.length > 35) this.history.pop();
            }

            flock(school) {
                let sepX = 0, sepY = 0, neighbors = 0;
                for (let other of school) {
                    if (other === this) continue;
                    const dX = other.x - this.x;
                    const dY = other.y - this.y;
                    const dist = Math.sqrt(dX*dX + dY*dY);
                    if (dist < 70) {
                        sepX -= dX / (dist + 0.001);
                        sepY -= dY / (dist + 0.001);
                        neighbors++;
                    }
                }

                if (neighbors > 0) {
                    let sF = this.steer(sepX * 1.8, sepY * 1.2);
                    this.vx += sF.x; this.vy += sF.y;
                }

                if (foods.length > 0) {
                    let closest = null; let closestDist = Infinity;
                    for (let food of foods) {
                        const d = Math.sqrt((food.x-this.x)**2 + (food.y-this.y)**2);
                        if (d < closestDist) { closestDist = d; closest = food; }
                    }
                    if (closest && closestDist < 400) {
                        let fSeek = this.steer(closest.x - this.x, closest.y - this.y);
                        this.vx += fSeek.x * 1.4; this.vy += fSeek.y * 1.4;
                        if (closestDist < 15) {
                            const idx = foods.indexOf(closest);
                            if (idx > -1) foods.splice(idx, 1);
                        }
                    }
                }

                if (Math.random() < 0.02) {
                    this.vx += (Math.random() - 0.5) * 0.4;
                    this.vy += (Math.random() - 0.5) * 0.15;
                }

                const s = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
                if (s > this.maxSpeed) { this.vx = (this.vx/s)*this.maxSpeed; this.vy = (this.vy/s)*this.maxSpeed; }
            }

            steer(tX, tY) {
                let dX = tX - this.vx; let dY = tY - this.vy;
                const d = Math.sqrt(dX * dX + dY * dY);
                if (d > this.maxForce) { dX = (dX / d) * this.maxForce; dY = (dY / d) * this.maxForce; }
                return { x: dX, y: dY };
            }

            draw() {
                ctx.save();
                
                const getSeg = (idx) => this.history[Math.min(idx, this.history.length - 1)];
                const sizeFactor = this.phenotype.fSize;
                const tailLength = 45 * sizeFactor;
                const dir = this.facingRight ? -1 : 1; 
                const verticalLag = Math.sin(this.swimCycle) * 6 * sizeFactor;

                const finGrad = ctx.createLinearGradient(this.x, this.y, this.x + (tailLength * dir), this.y + verticalLag);
                finGrad.addColorStop(0, this.colorFinInner);
                finGrad.addColorStop(0.6, this.colorFinOuter);
                finGrad.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = finGrad;

                if (selectedA === this || selectedB === this) {
                    ctx.strokeStyle = '#ccff33';
                    ctx.lineWidth = 1;
                    ctx.beginPath(); ctx.arc(this.x, this.y, 25, 0, Math.PI*2); ctx.stroke();
                    ctx.font = '9px monospace';
                    ctx.fillStyle = '#ccff33';
                    ctx.fillText(selectedA === this ? 'Parent A' : 'Parent B', this.x - 22, this.y - 32);
                }

                // 1. ANTERIOR DORSAL VEIL (Side-View Crest)
                ctx.beginPath();
                ctx.moveTo(this.x - (4 * dir), this.y - 4);
                ctx.bezierCurveTo(
                    this.x + (15 * dir), this.y - (20 * sizeFactor),
                    this.x + (35 * dir), this.y - (25 * sizeFactor) + verticalLag,
                    this.x + (20 * dir), this.y
                );
                ctx.closePath(); ctx.fill();

                // 2. VENTRAL BANNER FIN (Lower hanging curtain)
                ctx.beginPath();
                ctx.moveTo(this.x, this.y + 3);
                ctx.bezierCurveTo(
                    this.x + (10 * dir), this.y + (20 * sizeFactor),
                    this.x + (35 * dir), this.y + (22 * sizeFactor) + verticalLag,
                    this.x + (25 * dir), this.y + 4
                );
                ctx.closePath(); ctx.fill();

                // 3. MAIN CAUDAL TAIL DRAG VEIL (Graceful flow physics)
                ctx.beginPath();
                ctx.moveTo(this.x + (12 * dir), this.y);
                const spreadY = 22 * this.phenotype.spread;
                ctx.bezierCurveTo(
                    this.x + (30 * dir), this.y - spreadY + (verticalLag * 0.5),
                    this.x + (tailLength * dir), this.y - (spreadY * 0.5) + verticalLag,
                    this.x + (tailLength * dir), this.y + verticalLag
                );
                ctx.bezierCurveTo(
                    this.x + (tailLength * dir), this.y + (spreadY * 0.5) + verticalLag,
                    this.x + (30 * dir), this.y + spreadY + (verticalLag * 0.5),
                    this.x + (12 * dir), this.y + 2
                );
                ctx.closePath(); ctx.fill();

                // 4. METALLIC SHADER MASK
                if (this.phenotype.metal > 0.35) {
                    ctx.fillStyle = this.colorGlint;
                    ctx.beginPath();
                    ctx.ellipse(this.x + (4 * dir), this.y + 1, 8, 4, 0, 0, Math.PI * 2);
                    ctx.fill();
                }

                // 5. SOLID STRUCTURAL ANATOMY TAPER
                ctx.fillStyle = this.colorCore;
                for (let i = 0; i < this.bodyLength; i++) {
                    const seg = getSeg(i * 2);
                    const thickness = (this.bodyLength - i) * 0.9;
                    const drawX = this.x + (i * 2.2 * dir);
                    const drawY = seg.y;
                    
                    ctx.beginPath();
                    ctx.arc(drawX, drawY, thickness, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Pectoral fin overlay
                ctx.fillStyle = 'rgba(255,255,255,0.2)';
                ctx.beginPath(); ctx.ellipse(this.x - (2 * dir), this.y + 2, 4, 6, 0.3 * dir, 0, Math.PI*2); ctx.fill();

                // Ocular focus point
                ctx.fillStyle = '#ffffff';
                ctx.beginPath(); ctx.arc(this.x - (7 * dir), this.y - 1, 1, 0, Math.PI*2); ctx.fill();
                
                // Display breeder tag under fish profile
                ctx.font = '8px monospace';
                ctx.fillStyle = 'rgba(255,255,255,0.35)';
                ctx.fillText(`ID:${this.id} By: ${this.breeder}`, this.x - 25, this.y + 18);

                ctx.restore();
            }
        }

        // Setup primary stock population
        for(let i = 0; i < 10; i++) { school.push(new AquariumBetta()); }

        function engineLoop() {
            ctx.fillStyle = 'rgba(1, 10, 24, 0.25)';
            ctx.fillRect(0, 0, width, height);

            popCountEl.innerText = `Bettas Active: ${school.length}`;

            for (let i = foods.length - 1; i >= 0; i--) {
                let f = foods[i];
                f.y += f.vy;
                if (f.y > height - 20) {
                    foods.splice(i, 1);
                    continue;
                }
                ctx.fillStyle = '#ccff33';
                ctx.beginPath(); ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2); ctx.fill();
            }

            school.forEach(betta => {
                betta.flock(school);
                betta.update();
                betta.draw();
            });

            requestAnimationFrame(engineLoop);
        }

        engineLoop();
    </script>
</body>
</html>
