<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polygenic Betta Genetic Lab - Organic Asset Engine</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #01040a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        .hud-panel {
            position: absolute;
            top: 25px;
            left: 25px;
            z-index: 10;
            color: #e2e8f0;
            background: rgba(2, 8, 18, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 22px;
            border: 1px solid rgba(0, 180, 216, 0.2);
            border-radius: 14px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            width: 320px;
        }
        .hud-title { font-weight: 600; font-size: 0.95rem; margin-bottom: 12px; letter-spacing: 1px; text-transform: uppercase; color: #00e5ff; }
        .hud-stat { font-size: 0.85rem; color: #94a3b8; margin-bottom: 6px; }
        
        .breed-panel {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }
        .selector-slot {
            background: rgba(255, 255, 255, 0.02);
            padding: 10px 12px;
            margin-bottom: 8px;
            font-size: 0.8rem;
            color: #64748b;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            text-overflow: ellipsis;
            overflow: hidden;
            white-space: nowrap;
        }
        .selector-slot.active { color: #fff; border: 1px solid #00e5ff; background: rgba(0, 229, 255, 0.04); }
        
        button {
            width: 100%;
            background: linear-gradient(135deg, #00b4d8, #00e5ff);
            color: #020b14;
            border: none;
            padding: 11px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 8px;
        }
        button:hover { background: linear-gradient(135deg, #fff, #00e5ff); }
        button:disabled { background: #1e293b; color: #475569; cursor: not-allowed; }

        .discovery-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            width: 480px;
            background: rgba(2, 6, 14, 0.98);
            border: 1px solid rgba(0, 229, 255, 0.4);
            border-radius: 16px;
            z-index: 100;
            color: #f8fafc;
            padding: 25px;
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.9);
            display: none;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .discovery-modal.show { display: block; opacity: 1; transform: translate(-50%, -50%) scale(1); }
        .modal-header { font-size: 1.1rem; font-weight: bold; color: #00e5ff; margin-bottom: 15px; border-bottom: 1px solid rgba(0, 229, 255, 0.2); padding-bottom: 10px; display: flex; justify-content: space-between; }
        .gene-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; font-family: monospace; font-size: 0.8rem; }
        .gene-card { background: rgba(255,255,255,0.02); padding: 8px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.04); }
        .gene-name { color: #94a3b8; font-size: 0.75rem; text-transform: uppercase; }
        .gene-val { color: #fff; font-weight: bold; margin-top: 2px; }
        .gene-alert-neg { color: #ff3366; font-weight: bold; }
        .gene-alert-pos { color: #ccff33; font-weight: bold; }
        .close-modal-btn { background: #00e5ff; color: #020b14; border: none; padding: 8px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; text-transform: uppercase; }

        .interaction-tip {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.75rem;
            pointer-events: none;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
    </style>
</head>
<body>

    <div class="hud-panel">
        <div class="hud-title">🧬 Biological Morph Engine</div>
        <div class="hud-stat" id="pop-count">Active Phenotypes: 0</div>
        
        <div class="breed-panel">
            <div class="hud-title" style="font-size:0.8rem; color:#00b4d8;">Gene-Splicing Assembly</div>
            <div class="selector-slot" id="slot-a">Select Parent A...</div>
            <div class="selector-slot" id="slot-b">Select Parent B...</div>
            <button id="breed-btn" disabled onclick="executeManualBreeding()">Combine Genetic Sequences</button>
        </div>
    </div>

    <div class="discovery-modal" id="discovery-window">
        <div class="modal-header">
            <span>🔬 Chromosome Phenotype Card</span>
            <span style="color: #94a3b8; font-size: 0.8rem;" id="fry-id-tag">ID: 0</span>
        </div>
        <div class="gene-grid" id="gene-display-target"></div>
        <div style="text-align: right;">
            <button class="close-modal-btn" onclick="closeDiscoveryWindow()">Introduce to Ecosystem</button>
        </div>
    </div>

    <div class="interaction-tip">
        Click fish to pair genotypes • Tap deep water to disperse nutrients
    </div>

    <canvas id="aquarium-canvas"></canvas>

    <script>
        const canvas = document.getElementById('aquarium-canvas');
        const ctx = canvas.getContext('2d');
        const popCountEl = document.getElementById('pop-count');
        const slotAEl = document.getElementById('slot-a');
        const slotBEl = document.getElementById('slot-b');
        const breedBtn = document.getElementById('breed-btn');
        const discoveryWindow = document.getElementById('discovery-window');
        const geneDisplayTarget = document.getElementById('gene-display-target');
        const fryIdTag = document.getElementById('fry-id-tag');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        const school = [];
        const foods = [];
        const particles = [];
        const dynamicTrails = [];
        let selectedA = null;
        let selectedB = null;

        for(let i=0; i<60; i++) {
            particles.push({ x: Math.random() * width, y: Math.random() * height, r: Math.random() * 2 + 0.5, speed: Math.random() * 0.12 + 0.04, phase: Math.random() * Math.PI * 2 });
        }

        window.addEventListener('resize', () => { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; });

        window.addEventListener('click', (e) => {
            if (e.clientX < 360 && e.clientY < 420) return;
            if (discoveryWindow.classList.contains('show')) return;

            let clickedFish = null;
            for (let betta of school) {
                const dist = Math.sqrt((e.clientX - betta.x) ** 2 + (e.clientY - betta.y) ** 2);
                if (dist < 60) { clickedFish = betta; break; }
            }

            if (clickedFish) {
                if (selectedA === clickedFish) selectedA = null;
                else if (selectedB === clickedFish) selectedB = null;
                else if (!selectedA) selectedA = clickedFish;
                else selectedB = clickedFish;
                updateSelectionHUD();
            } else {
                foods.push({ x: e.clientX, y: e.clientY, radius: 3.5, vy: 0.9 });
            }
        });

        function updateSelectionHUD() {
            slotAEl.innerText = selectedA ? `A: ID-${selectedA.id} [${selectedA.phenotype.shape}]` : "Select Parent A...";
            selectedA ? slotAEl.classList.add('active') : slotAEl.classList.remove('active');
            slotBEl.innerText = selectedB ? `B: ID-${selectedB.id} [${selectedB.phenotype.shape}]` : "Select Parent B...";
            selectedB ? slotBEl.classList.add('active') : slotBEl.classList.remove('active');
            breedBtn.disabled = !(selectedA && selectedB);
        }

        function executeManualBreeding() {
            if (!selectedA || !selectedB) return;
            const fry = new GeneticBetta(selectedA.genome, selectedB.genome, width / 2, height / 2 - 40);
            school.push(fry);
            triggerDiscoveryWindow(fry);
            selectedA = null; selectedB = null;
            updateSelectionHUD();
        }

        function triggerDiscoveryWindow(fish) {
            fryIdTag.innerText = `MUTATION LAB ID: ${fish.id}`;
            let mutationStatus = "<span style='color:#cbd5e1'>Stable Sequence</span>";
            if(fish.phenotype.clampedFin) mutationStatus = "<span class='gene-alert-neg'>[PATHOLOGY] Clamped Fin Syndrome</span>";
            else if(fish.phenotype.iridescent) mutationStatus = "<span class='gene-alert-pos'>[MUTATION] Crystalline Iridescence</span>";

            geneDisplayTarget.innerHTML = `
                <div class="gene-card"><div class="gene-name">Expressed Tail Morph</div><div class="gene-val" style="color:#00e5ff">${fish.phenotype.shape}</div></div>
                <div class="gene-card"><div class="gene-name">Expressed Coat Pattern</div><div class="gene-val" style="color:#ccff33">${fish.phenotype.pattern}</div></div>
                <div class="gene-card"><div class="gene-name">Base Chromosome Color</div><div class="gene-val">HSL ${Math.floor(fish.phenotype.hBase)}°</div></div>
                <div class="gene-card"><div class="gene-name">Accent Split Color</div><div class="gene-val">HSL ${Math.floor(fish.phenotype.hAcc)}°</div></div>
                <div class="gene-card" style="grid-column: span 2;"><div class="gene-name">Biological Trait Profile</div><div class="gene-val">${mutationStatus}</div></div>
            `;
            discoveryWindow.classList.add('show');
        }

        function closeDiscoveryWindow() { discoveryWindow.classList.remove('show'); }
        function hslStr(h, s, l, a = 1) { return `hsla(${Math.floor(h) % 360}, ${s}%, ${l}%, ${a})`; }

        let idCounter = 1;

        class GeneticBetta {
            constructor(parentA = null, parentB = null, spawnX = null, spawnY = null) {
                this.id = idCounter++;
                this.x = spawnX || Math.random() * width;
                this.y = spawnY || (0.2 + Math.random() * 0.6) * height;
                
                this.angle = Math.random() * Math.PI * 2;
                this.speed = 1.0;
                this.targetAngle = this.angle;
                this.vx = Math.cos(this.angle);
                this.vy = Math.sin(this.angle);
                this.facingRight = this.vx > 0;

                if (parentA && parentB) {
                    this.genome = {
                        hueBase:    this.cross(parentA.hueBase, parentB.hueBase, 360, true),
                        hueAcc:     this.cross(parentA.hueAcc, parentB.hueAcc, 360, true),
                        shapeAllele:this.cross(parentA.shapeAllele, parentB.shapeAllele, 1.0, false),
                        patAllele:  this.cross(parentA.patAllele, parentB.patAllele, 1.0, false),
                        traitMod:   this.cross(parentA.traitMod, parentB.traitMod, 1.0, false)
                    };
                } else {
                    this.genome = {
                        hueBase:    [Math.random() * 360, Math.random() * 360],
                        hueAcc:     [Math.random() * 360, Math.random() * 360],
                        shapeAllele:[Math.random(), Math.random()],
                        patAllele:  [Math.random(), Math.random()],
                        traitMod:   [Math.random(), Math.random()]
                    };
                }

                this.expressPhenotypes();

                this.patternSeeds = [];
                let randGen = Math.sin(this.id * 8543.21);
                for(let k = 0; k < 25; k++) {
                    randGen = Math.sin(randGen * 456.789);
                    this.patternSeeds.push({
                        segment: Math.floor((randGen + 1) * 6),
                        ang: randGen * Math.PI * 2,
                        size: 5 + Math.abs(randGen) * 15,
                        opacity: 0.4 + Math.abs(randGen) * 0.5
                    });
                }

                this.maxTurnRate = 0.035;
                if (this.phenotype.clampedFin) this.maxTurnRate *= 0.6;

                this.bodySegments = 14;
                this.history = [];
                for(let i = 0; i < 60; i++) this.history.push({ x: this.x, y: this.y, angle: this.angle });
                this.swimCycle = Math.random() * 100;
            }

            cross(pA, pB, maxVal, isCircular) {
                const a = pA[Math.floor(Math.random() * 2)];
                const b = pB[Math.floor(Math.random() * 2)];
                let output = [a, b];
                if (Math.random() < 0.25) {
                    const idx = Math.floor(Math.random() * 2);
                    output[idx] = isCircular ? (output[idx] + (Math.random() * 80 - 40) + maxVal) % maxVal : Math.min(maxVal, Math.max(0.0, output[idx] + (Math.random() * 0.3 - 0.15)));
                }
                return output;
            }

            expressPhenotypes() {
                const res = (pair) => (pair[0] + pair[1]) * 0.5;
                const sVal = res(this.genome.shapeAllele);
                const pVal = res(this.genome.patAllele);
                const tVal = res(this.genome.traitMod);

                this.phenotype = {
                    hBase: res(this.genome.hueBase),
                    hAcc: res(this.genome.hueAcc),
                    shape: sVal < 0.25 ? "Plakat" : sVal < 0.50 ? "Halfmoon" : sVal < 0.75 ? "Crowntail" : "Veiltail",
                    pattern: pVal < 0.35 ? "Koi Marble" : pVal < 0.70 ? "Tiger Stripe" : "Candy Solid",
                    clampedFin: tVal < 0.18,
                    iridescent: tVal > 0.82
                };

                // Real tissue parameters (slightly desaturated core with deep translucency overrides)
                this.colorCore = hslStr(this.phenotype.hBase, 85, 45, 0.85);
                this.colorAcc = hslStr(this.phenotype.hAcc, 90, 52, 0.7);
                this.colorDark = hslStr((this.phenotype.hBase + 180) % 360, 60, 14, 0.8);
                this.colorTrim = hslStr(this.phenotype.hAcc, 95, 75, 0.5);

                this.targetSpeed = this.phenotype.clampedFin ? 0.75 : this.phenotype.iridescent ? 1.7 : 1.2;
            }

            update() {
                let diff = this.targetAngle - this.angle;
                while (diff < -Math.PI) diff += Math.PI * 2;
                while (diff > Math.PI) diff -= Math.PI * 2;

                this.angle += Math.max(-this.maxTurnRate, Math.min(this.maxTurnRate, diff));
                this.speed += (this.targetSpeed - this.speed) * 0.05;

                this.vx = Math.cos(this.angle) * this.speed;
                this.vy = Math.sin(this.angle) * this.speed;
                this.x += this.vx;
                this.y += this.vy;

                if (Math.abs(this.vx) > 0.05) this.facingRight = this.vx > 0;

                if (this.x < 80) { this.x = 80; this.targetAngle = 0; }
                if (this.x > width - 80) { this.x = width - 80; this.targetAngle = Math.PI; }
                if (this.y < 90) { this.y = 90; this.targetAngle = Math.PI/2; }
                if (this.y > height - 90) { this.y = height - 90; this.targetAngle = -Math.PI/2; }

                this.swimCycle += this.speed * 0.05 + 0.01;
                
                this.history.unshift({ x: this.x, y: this.y, angle: this.angle });
                if (this.history.length > 60) this.history.pop();

                if (this.phenotype.iridescent && Math.random() < 0.3) {
                    dynamicTrails.push({
                        x: this.history[10].x + (Math.random()-0.5)*8, y: this.history[10].y + (Math.random()-0.5)*8,
                        r: Math.random() * 2 + 0.5, alpha: 0.8,
                        color: this.colorTrim
                    });
                }
            }

            flock(school) {
                let fX = 0, fY = 0, count = 0;
                for (let other of school) {
                    if (other === this) continue;
                    const d = Math.sqrt((other.x - this.x)**2 + (other.y - this.y)**2);
                    if (d < 100) { fX -= (other.x - this.x)/d; fY -= (other.y - this.y)/d; count++; }
                }
                
                let fed = false;
                if (foods.length > 0) {
                    let near = null, nearD = Infinity;
                    for (let f of foods) {
                        const d = Math.sqrt((f.x-this.x)**2 + (f.y-this.y)**2);
                        if (d < nearD) { nearD = d; near = f; }
                    }
                    if (near && nearD < 450) {
                        fX += (near.x - this.x)*1.6; fY += (near.y - this.y)*1.6; fed = true;
                        if (nearD < 16) foods.splice(foods.indexOf(near), 1);
                    }
                }

                if (!fed && Math.random() < 0.008) this.targetAngle += (Math.random() - 0.5) * 1.8;
                if (count > 0 || fed) this.targetAngle = Math.atan2(fY, fX);
            }

            // --- PROCEDURAL BIOLOGICAL TEXTURE APPLIER ---
            applyRealisticTexture(customCtx, isBody = false) {
                // Primary deep layer 3D gradient
                let depthGrad = customCtx.createLinearGradient(this.history[12].x, this.history[12].y, this.history[0].x, this.history[0].y);
                depthGrad.addColorStop(0, hslStr(this.phenotype.hBase, 80, 25, isBody ? 0.95 : 0.4));
                depthGrad.addColorStop(0.5, this.colorCore);
                depthGrad.addColorStop(1, hslStr(this.phenotype.hBase, 95, 60, isBody ? 0.95 : 0.6));
                customCtx.fillStyle = depthGrad;
                customCtx.fill();

                customCtx.save();
                customCtx.globalCompositeOperation = "source-atop";
                
                if (this.phenotype.pattern === "Koi Marble") {
                    this.patternSeeds.forEach(s => {
                        const n = this.history[Math.min(s.segment * 2, this.history.length-1)];
                        let patchGrad = customCtx.createRadialGradient(n.x, n.y, 0, n.x, n.y, s.size);
                        patchGrad.addColorStop(0, hslStr((this.phenotype.hBase + 180) % 360, 50, 12, s.opacity));
                        patchGrad.addColorStop(0.8, hslStr((this.phenotype.hBase + 180) % 360, 60, 16, s.opacity * 0.5));
                        patchGrad.addColorStop(1, "rgba(0,0,0,0)");
                        
                        customCtx.fillStyle = patchGrad;
                        customCtx.beginPath(); customCtx.arc(n.x + Math.cos(s.ang)*4, n.y + Math.sin(s.ang)*4, s.size, 0, Math.PI*2); customCtx.fill();
                    });
                    
                    this.patternSeeds.forEach((s, i) => {
                        if (i % 2 === 0) {
                            const n = this.history[Math.min((13 - s.segment) * 2, this.history.length-1)];
                            let accentGrad = customCtx.createRadialGradient(n.x, n.y, 0, n.x, n.y, s.size * 0.7);
                            accentGrad.addColorStop(0, hslStr(this.phenotype.hAcc, 90, 50, s.opacity * 0.9));
                            accentGrad.addColorStop(1, "rgba(0,0,0,0)");
                            customCtx.fillStyle = accentGrad;
                            customCtx.beginPath(); customCtx.arc(n.x, n.y, s.size * 0.7, 0, Math.PI*2); customCtx.fill();
                        }
                    });
                } 
                else if (this.phenotype.pattern === "Tiger Stripe") {
                    for (let i = 2; i < this.bodySegments - 1; i += 2) {
                        const n = this.history[i * 2];
                        const normalAng = n.angle + Math.PI / 2;
                        let stripeGrad = customCtx.createLinearGradient(
                            n.x - Math.cos(normalAng)*16, n.y - Math.sin(normalAng)*16,
                            n.x + Math.cos(normalAng)*16, n.y + Math.sin(normalAng)*16
                        );
                        stripeGrad.addColorStop(0, "rgba(0,0,0,0)");
                        stripeGrad.addColorStop(0.3, hslStr((this.phenotype.hBase + 180) % 360, 70, 12, 0.85));
                        stripeGrad.addColorStop(0.7, hslStr((this.phenotype.hBase + 180) % 360, 70, 12, 0.85));
                        stripeGrad.addColorStop(1, "rgba(0,0,0,0)");
                        
                        customCtx.strokeStyle = stripeGrad;
                        customCtx.lineWidth = 4.5;
                        customCtx.beginPath();
                        customCtx.moveTo(n.x + Math.cos(normalAng) * 16, n.y + Math.sin(normalAng) * 16);
                        customCtx.lineTo(n.x - Math.cos(normalAng) * 16, n.y - Math.sin(normalAng) * 16);
                        customCtx.stroke();
                    }
                } 
                else if (this.phenotype.pattern === "Candy Solid") {
                    let grad = customCtx.createLinearGradient(this.history[12].x, this.history[12].y, this.history[0].x, this.history[0].y);
                    grad.addColorStop(0, this.colorAcc);
                    grad.addColorStop(0.4, this.colorCore);
                    grad.addColorStop(1, this.colorTrim);
                    customCtx.fillStyle = grad;
                    customCtx.fill();
                }

                // Append organic cellular noise overlay (Micro scales profile)
                customCtx.fillStyle = "rgba(255, 255, 255, 0.05)";
                for(let k=0; k<15; k++) {
                    let hNode = this.history[Math.min(k*3, this.history.length-1)];
                    customCtx.fillRect(hNode.x + Math.sin(k)*6, hNode.y + Math.cos(k)*4, 2, 2);
                }

                customCtx.restore();
            }

            // --- PROCEDURAL FIN ANATOMY COMPILER ---
            drawOrganicFinMesh(startIndex, rays, lenScale, widthRange, typeSign) {
                let finScale = this.phenotype.clampedFin ? 0.45 : 1.0;
                ctx.save();
                ctx.beginPath();
                
                let structuralNodes = [];

                for (let r = 0; r <= rays; r++) {
                    const ratio = r / rays;
                    const histIdx = Math.floor(startIndex + ratio * 10);
                    const node = this.history[Math.min(histIdx, this.history.length - 1)];
                    
                    let dynamicWave = Math.sin(this.swimCycle - (histIdx * 0.22));
                    let angleOffset = (ratio - 0.5) * widthRange;
                    if (this.phenotype.shape === "Veiltail") angleOffset += 0.3; 
                    
                    const fAngle = node.angle + Math.PI + (0.65 * typeSign) + angleOffset;
                    
                    let baseLen = 42 * finScale * lenScale;
                    if (this.phenotype.shape === "Halfmoon") baseLen *= 1.45; 
                    if (this.phenotype.shape === "Veiltail") baseLen *= 1.75 * (0.65 + ratio * 0.5); 

                    let endX = node.x + Math.cos(fAngle) * baseLen;
                    let endY = node.y + Math.sin(fAngle) * baseLen + (dynamicWave * 5);

                    if (r === 0) ctx.moveTo(node.x, node.y);
                    structuralNodes.push({ bx: node.x, by: node.y, ex: endX, ey: endY });
                    ctx.lineTo(endX, endY);
                }

                for (let r = rays; r >= 0; r--) ctx.lineTo(structuralNodes[r].bx, structuralNodes[r].by);
                ctx.closePath();
                
                ctx.save();
                ctx.clip();
                this.applyRealisticTexture(ctx, false);
                ctx.restore();

                // Draw explicit skeletal tissue rays (Removes flat shape appearance)
                ctx.save();
                for (let r = 0; r <= rays; r++) {
                    let rayGrad = ctx.createLinearGradient(structuralNodes[r].bx, structuralNodes[r].by, structuralNodes[r].ex, structuralNodes[r].ey);
                    rayGrad.addColorStop(0, "rgba(255,255,255,0.4)");
                    rayGrad.addColorStop(0.5, this.colorTrim);
                    rayGrad.addColorStop(1, "rgba(255,255,255,0.0)");
                    
                    ctx.strokeStyle = rayGrad;
                    ctx.lineWidth = r % 3 === 0 ? 1.5 : 0.8; // Soft variant branching
                    ctx.beginPath();
                    ctx.moveTo(structuralNodes[r].bx, structuralNodes[r].by);
                    ctx.lineTo(structuralNodes[r].ex, structuralNodes[r].ey);
                    ctx.stroke();
                }
                ctx.restore();

                if (this.phenotype.shape === "Crowntail") {
                    ctx.save(); ctx.globalCompositeOperation = "destination-out";
                    ctx.fillStyle = "rgba(0,0,0,1)";
                    for (let r = 0; r < rays; r += 2) {
                        ctx.beginPath();
                        ctx.moveTo(structuralNodes[r].ex, structuralNodes[r].ey);
                        ctx.lineTo(structuralNodes[r+1].ex, structuralNodes[r+1].ey);
                        ctx.lineTo((structuralNodes[r].bx + structuralNodes[r].ex)/2, (structuralNodes[r].by + structuralNodes[r].ey)/2);
                        ctx.closePath(); ctx.fill();
                    }
                    ctx.restore();
                }

                // Render soft outer edge glowing membrane border
                let edgeGrad = ctx.createLinearGradient(structuralNodes[0].ex, structuralNodes[0].ey, structuralNodes[rays].ex, structuralNodes[rays].ey);
                edgeGrad.addColorStop(0, this.colorTrim); edgeGrad.addColorStop(0.5, "rgba(255,255,255,0.6)"); edgeGrad.addColorStop(1, this.colorTrim);
                ctx.strokeStyle = edgeGrad;
                ctx.lineWidth = 1.0;
                ctx.beginPath();
                ctx.moveTo(structuralNodes[0].ex, structuralNodes[0].ey);
                for(let r=1; r<=rays; r++) ctx.lineTo(structuralNodes[r].ex, structuralNodes[r].ey);
                ctx.stroke();

                ctx.restore();
            }

            draw() {
                ctx.save();
                const dir = this.facingRight ? 1 : -1;

                if (selectedA === this || selectedB === this) {
                    ctx.strokeStyle = 'rgba(0, 229, 255, 0.4)'; ctx.lineWidth = 1;
                    ctx.setLineDash([4, 4]);
                    ctx.beginPath(); ctx.arc(this.x, this.y, 45, 0, Math.PI*2); ctx.stroke();
                    ctx.setLineDash([]);
                }

                // 1. Structural Fin Meshes
                this.drawOrganicFinMesh(6, 16, 1.0, 1.1, 1);
                this.drawOrganicFinMesh(3, 16, 0.9, 1.0, -1);

                // 2. Caudal Fin Assembly
                ctx.save();
                ctx.beginPath();
                let cRays = 22;
                let cNodes = [];
                let finScale = this.phenotype.clampedFin ? 0.5 : 1.0;

                for (let r = 0; r <= cRays; r++) {
                    const ratio = r / cRays;
                    const histIdx = Math.floor(12 + ratio * 10);
                    const node = this.history[Math.min(histIdx, this.history.length - 1)];
                    let spreadFactor = this.phenotype.shape === "Halfmoon" ? 2.5 : this.phenotype.shape === "Plakat" ? 0.9 : 1.4;
                    
                    const spreadAngle = (ratio - 0.5) * spreadFactor;
                    const tAngle = node.angle + Math.PI + spreadAngle;
                    
                    let cLen = 48 * finScale;
                    if (this.phenotype.shape === "Halfmoon") cLen *= 1.35;
                    if (this.phenotype.shape === "Veiltail") cLen *= 1.65;
                    
                    let endX = node.x + Math.cos(tAngle) * cLen;
                    let endY = node.y + Math.sin(tAngle) * cLen + (Math.sin(this.swimCycle - histIdx*0.18)*5);

                    if (r === 0) ctx.moveTo(node.x, node.y);
                    cNodes.push({ bx: node.x, by: node.y, ex: endX, ey: endY });
                    ctx.lineTo(endX, endY);
                }
                for (let r = cRays; r >= 0; r--) ctx.lineTo(cNodes[r].bx, cNodes[r].by);
                ctx.closePath();
                
                ctx.save();
                ctx.clip();
                this.applyRealisticTexture(ctx, false);
                ctx.restore();

                // Biological structural lines inside Caudal Fin
                for (let r = 0; r <= cRays; r++) {
                    ctx.strokeStyle = "rgba(255,255,255,0.18)";
                    ctx.lineWidth = 0.8;
                    ctx.beginPath(); ctx.moveTo(cNodes[r].bx, cNodes[r].by); ctx.lineTo(cNodes[r].ex, cNodes[r].ey); ctx.stroke();
                }

                if (this.phenotype.shape === "Crowntail") {
                    ctx.save(); ctx.globalCompositeOperation = "destination-out";
                    ctx.fillStyle = "rgba(0,0,0,1)";
                    for (let r = 0; r < cRays; r += 2) {
                        ctx.beginPath(); ctx.moveTo(cNodes[r].ex, cNodes[r].ey); ctx.lineTo(cNodes[r+1].ex, cNodes[r+1].ey);
                        ctx.lineTo((cNodes[r].bx+cNodes[r].ex)/2, (cNodes[r].by+cNodes[r].ex)/2); ctx.closePath(); ctx.fill();
                    }
                    ctx.restore();
                }

                ctx.strokeStyle = this.colorTrim;
                ctx.lineWidth = 1.2;
                ctx.beginPath();
                ctx.moveTo(cNodes[0].ex, cNodes[0].ey);
                for(let r=1; r<=cRays; r++) ctx.lineTo(cNodes[r].ex, cNodes[r].ey);
                ctx.stroke();
                ctx.restore();

                // 3. Thick 3D Muscle Contour Rendering (Eliminates flat segments appearance)
                ctx.save();
                ctx.beginPath();
                // Create progressive outer shell layout envelope path
                for (let i = 0; i < this.bodySegments; i++) {
                    const node = this.history[Math.min(i * 3, this.history.length - 1)];
                    const thickness = (10.0 * (1 - (i / this.bodySegments))) + 1.5;
                    ctx.arc(node.x, node.y, thickness, 0, Math.PI * 2);
                }
                ctx.closePath();
                ctx.clip();
                this.applyRealisticTexture(ctx, true);
                ctx.restore();

                // 4. Photorealistic Head Depth Contour details
                const headNode = this.history[0];
                
                // Gills shadow line depth overlay
                ctx.strokeStyle = "rgba(0, 0, 0, 0.35)";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(headNode.x - (3 * dir), headNode.y, 7, -Math.PI/3, Math.PI/3);
                ctx.stroke();

                // Eye structure setup (Real gloss layering)
                let eyeX = headNode.x + (6 * dir);
                let eyeY = headNode.y - 1.5;
                
                ctx.fillStyle = "#040914";
                ctx.beginPath(); ctx.arc(eyeX, eyeY, 3.2, 0, Math.PI*2); ctx.fill();
                
                let irisGrad = ctx.createRadialGradient(eyeX, eyeY, 0, eyeX, eyeY, 3);
                irisGrad.addColorStop(0, "#000");
                irisGrad.addColorStop(0.7, this.colorTrim);
                irisGrad.addColorStop(1, "#040914");
                ctx.fillStyle = irisGrad;
                ctx.beginPath(); ctx.arc(eyeX, eyeY, 2.4, 0, Math.PI*2); ctx.fill();

                // Lens Reflection Highlight Specular Dot
                ctx.fillStyle = "rgba(255,255,255,0.95)";
                ctx.beginPath(); ctx.arc(eyeX + (1 * dir), eyeY - 1, 0.8, 0, Math.PI*2); ctx.fill();

                ctx.restore();
            }
        }

        for(let i = 0; i < 6; i++) school.push(new GeneticBetta());

        function engineLoop() {
            if (discoveryWindow.classList.contains('show')) {
                ctx.fillStyle = 'rgba(1, 4, 10, 0.08)';
                ctx.fillRect(0, 0, width, height);
                const specimen = school[school.length - 1];
                if (specimen) { specimen.speed = 0; specimen.update(); specimen.draw(); }
                requestAnimationFrame(engineLoop);
                return;
            }

            // Oceanic dark light gradient frame backdrop
            const bg = ctx.createLinearGradient(0, 0, 0, height);
            bg.addColorStop(0, '#020b18'); bg.addColorStop(0.6, '#01050d'); bg.addColorStop(1, '#000205');
            ctx.fillStyle = bg; ctx.fillRect(0, 0, width, height);

            popCountEl.innerText = `Active Phenotypes: ${school.length}`;

            for(let i = dynamicTrails.length - 1; i >= 0; i--) {
                let t = dynamicTrails[i];
                t.alpha -= 0.025;
                if(t.alpha <= 0) { dynamicTrails.splice(i, 1); continue; }
                ctx.save();
                ctx.globalAlpha = t.alpha;
                ctx.fillStyle = t.color;
                ctx.beginPath(); ctx.arc(t.x, t.y, t.r, 0, Math.PI*2); ctx.fill();
                ctx.restore();
            }

            ctx.fillStyle = 'rgba(255, 255, 255, 0.06)';
            particles.forEach(p => {
                p.phase += 0.004; p.y -= p.speed;
                if(p.y < -10) p.y = height + 10;
                ctx.beginPath(); ctx.arc(p.x + Math.sin(p.phase)*12, p.y, p.r, 0, Math.PI*2); ctx.fill();
            });

            for (let i = foods.length - 1; i >= 0; i--) {
                let f = foods[i]; f.y += f.vy;
                if (f.y > height - 25) { foods.splice(i, 1); continue; }
                ctx.fillStyle = '#a3e635';
                ctx.beginPath(); ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2); ctx.fill();
            }

            school.forEach(betta => { betta.flock(school); betta.update(); betta.draw(); });

            requestAnimationFrame(engineLoop);
        }

        engineLoop();
    </script>
</body>
