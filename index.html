<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>24/7 Live Aesthetic Aquarium Ecosystem</title>
    <style>
        /* Modern Reset and Layout setup */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #011125;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            transition: background 2s ease-in-out;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Sleek, Minimalist HUD overlay */
        .aquarium-hud {
            position: absolute;
            top: 30px;
            left: 30px;
            z-index: 10;
            color: rgba(255, 255, 255, 0.85);
            pointer-events: none;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .time-stream {
            font-size: 1.75rem;
            font-weight: 300;
            letter-spacing: 2px;
            font-variant-numeric: tabular-nums;
        }

        .eco-status {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 6px;
            opacity: 0.5;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .eco-status::before {
            content: "";
            display: inline-block;
            width: 6px;
            height: 6px;
            background: #00f5d4;
            border-radius: 50%;
            box-shadow: 0 0 8px #00f5d4;
        }

        .interaction-tip {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.8rem;
            letter-spacing: 1px;
            pointer-events: none;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="aquarium-hud">
        <div class="time-stream" id="clock-widget">00:00:00</div>
        <div class="eco-status" id="eco-label">Syncing Marine Cycle...</div>
    </div>

    <div class="interaction-tip">Click anywhere inside the tank to feed the fish</div>

    <canvas id="aquarium-canvas"></canvas>

    <script>
        const canvas = document.getElementById('aquarium-canvas');
        const ctx = canvas.getContext('2d');
        const clockEl = document.getElementById('clock-widget');
        const statusEl = document.getElementById('eco-label');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        // Interactive states
        const foods = [];
        let currentTheme = 'afternoon';

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        // Drop food coordinate objects on click
        window.addEventListener('click', (e) => {
            foods.push({
                x: e.clientX,
                y: e.clientY,
                radius: 4,
                speed: 1.2
            });
        });

        // --- TIME CYCLES MANAGEMENT ---
        const THEMES = {
            morning: { bg: ['#0a3d62', '#001f3f'], fishColor: 'rgba(0, 180, 216, 0.85)', label: 'Morning Light Influx' },
            afternoon: { bg: ['#005f73', '#0a3d62'], fishColor: 'rgba(0, 245, 212, 0.85)', label: 'Peak Midday Solar' },
            evening: { bg: ['#1d3557', '#03071e'], fishColor: 'rgba(247, 37, 133, 0.85)', label: 'Crepuscular Transition' },
            night: { bg: ['#03071e', '#000814'], fishColor: 'rgba(114, 9, 183, 0.9)', label: 'Bioluminescent Abyss Mode' }
        };

        function updateEcosystemTime() {
            const now = new Date();
            const hours = now.getHours();
            clockEl.innerText = now.toTimeString().split(' ')[0];

            let activeKey = 'afternoon';
            if (hours >= 6 && hours < 12) activeKey = 'morning';
            else if (hours >= 12 && hours < 18) activeKey = 'afternoon';
            else if (hours >= 18 && hours < 22) activeKey = 'evening';
            else activeKey = 'night';

            currentTheme = activeKey;
            statusEl.innerText = `Ecosystem: ${THEMES[activeKey].label}`;
        }

        // --- AMBIENT BUBBLES GENERATOR ---
        const bubbles = Array.from({ length: 45 }, () => ({
            x: Math.random() * width,
            y: Math.random() * height + height,
            radius: Math.random() * 3.5 + 0.5,
            speed: Math.random() * 1.2 + 0.4,
            wobble: Math.random() * 2,
            wobbleSpeed: Math.random() * 0.03
        }));

        // --- FISH (BOID CLUSTERS) CLASS ---
        class Fish {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                
                const angle = Math.random() * Math.PI * 2;
                this.vx = Math.cos(angle) * 2;
                this.vy = Math.sin(angle) * 2;

                this.maxSpeed = 2.2;
                this.maxForce = 0.04;
                this.perceptionRadius = 75;
            }

            edges() {
                const pad = 30;
                if (this.x < -pad) this.x = width + pad;
                if (this.x > width + pad) this.x = -pad;
                if (this.y < -pad) this.y = height + pad;
                if (this.y > height + pad) this.y = -pad;
            }

            steer(tX, tY) {
                let dX = tX - this.vx;
                let dY = tY - this.vy;
                const dist = Math.sqrt(dX * dX + dY * dY);
                if (dist > this.maxForce) {
                    dX = (dX / dist) * this.maxForce;
                    dY = (dY / dist) * this.maxForce;
                }
                return { x: dX, y: dY };
            }

            flock(school) {
                let sepX = 0, sepY = 0, aliX = 0, aliY = 0, cohX = 0, cohY = 0;
                let neighbors = 0;

                // 1. Core Boids Rules Analysis Loop
                for (let other of school) {
                    if (other === this) continue;
                    const dX = other.x - this.x;
                    const dY = other.y - this.y;
                    const dist = Math.sqrt(dX * dX + dY * dY);

                    if (dist < this.perceptionRadius) {
                        sepX -= dX / (dist + 0.001);
                        sepY -= dY / (dist + 0.001);
                        aliX += other.vx;
                        aliY += other.vy;
                        cohX += other.x;
                        cohY += other.y;
                        neighbors++;
                    }
                }

                if (neighbors > 0) {
                    aliX /= neighbors; aliY /= neighbors;
                    cohX /= neighbors; cohY /= neighbors;

                    const cohesionForce = this.steer(cohX - this.x, cohY - this.y);
                    const separationForce = this.steer(sepX * 2.2, sepY * 2.2);
                    const alignmentForce = this.steer(aliX, aliY);

                    this.vx += separationForce.x * 1.4 + alignmentForce.x * 1.0 + cohesionForce.x * 1.0;
                    this.vy += separationForce.y * 1.4 + alignmentForce.y * 1.0 + cohesionForce.y * 1.0;
                }

                // 2. Interactive Food Foraging Behavior Override
                if (foods.length > 0) {
                    let closestFood = null;
                    let closestDist = Infinity;

                    for (let food of foods) {
                        const fDX = food.x - this.x;
                        const fDY = food.y - this.y;
                        const fDist = Math.sqrt(fDX * fDX + fDY * fDY);
                        if (fDist < closestDist && fDist < 250) {
                            closestDist = fDist;
                            closestFood = food;
                        }
                    }

                    if (closestFood) {
                        const foodSeek = this.steer(closestFood.x - this.x, closestFood.y - this.y);
                        this.vx += foodSeek.x * 1.8;
                        this.vy += foodSeek.y * 1.8;

                        // Eat food condition
                        if (closestDist < 12) {
                            const index = foods.indexOf(closestFood);
                            if (index > -1) foods.splice(index, 1);
                        }
                    }
                }
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                if (speed > this.maxSpeed) {
                    this.vx = (this.vx / speed) * this.maxSpeed;
                    this.vy = (this.vy / speed) * this.maxSpeed;
                }
                this.edges();
            }

            draw() {
                const angle = Math.atan2(this.vy, this.vx);
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(angle);

                ctx.fillStyle = THEMES[currentTheme].fishColor;
                ctx.shadowBlur = currentTheme === 'night' ? 12 : 0;
                ctx.shadowColor = THEMES[currentTheme].fishColor;

                // Minimalist geometric organic fish profile
                ctx.beginPath();
                ctx.moveTo(14, 0);       
                ctx.lineTo(-10, -5);     
                ctx.lineTo(-6, 0);       
                ctx.lineTo(-10, 5);      
                ctx.closePath();
                ctx.fill();

                ctx.restore();
            }
        }

        // Instantiation loops
        const school = Array.from({ length: 70 }, () => new Fish());

        // --- CORE RENDER CANVAS ENGINE LOOP ---
        function mainLoop() {
            // Draw Dynamic Water Depth Gradient
            const activeBg = THEMES[currentTheme].bg;
            const gradient = ctx.createLinearGradient(0, 0, 0, height);
            gradient.addColorStop(0, activeBg[0]);
            gradient.addColorStop(1, activeBg[1]);
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);

            // Manage, Update & Render Interactive Foods
            ctx.fillStyle = '#ffb703';
            ctx.shadowBlur = 8;
            ctx.shadowColor = '#ffb703';
            for (let i = foods.length - 1; i >= 0; i--) {
                let f = foods[i];
                f.y += f.speed;
                ctx.beginPath();
                ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2);
                ctx.fill();

                // Clean up missed food settling out of frame boundary
                if (f.y > height + 10) foods.splice(i, 1);
            }
            ctx.shadowBlur = 0; // Reset canvas shadow context map

            // Draw Background Aquarium Bubbles
            ctx.fillStyle = 'rgba(255, 255, 255, 0.18)';
            bubbles.forEach(b => {
                b.y -= b.speed;
                b.x += Math.sin(b.wobble) * 0.35;
                b.wobble += b.wobbleSpeed;

                if (b.y < -10) {
                    b.y = height + 10;
                    b.x = Math.random() * width;
                }
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            // Update & Render Flocking Boid Elements
            school.forEach(fish => {
                fish.flock(school);
                fish.update();
                fish.draw();
            });

            requestAnimationFrame(mainLoop);
        }

        // Initialize Application Hooks
        setInterval(updateEcosystemTime, 1000);
        updateEcosystemTime();
        mainLoop();
    </script>
</body>
</html>
